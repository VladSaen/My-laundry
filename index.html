<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запис на прання</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c",
            measurementId: "G-N33YNQTN3B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const ADMIN_PASSWORD = "Tokyo";
        const PACKAGES = {
            small: { label: 'Малий пакет', desc: 'До 5кг. Повернення ~24 год.' },
            medium: { label: 'Середній пакет', desc: '5-10кг. Повернення ~24-48 год.' },
            large: { label: 'Великий пакет', desc: '10кг+. Повернення ~48-72 год.' }
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('laundry_user')) || null);
            const [bookings, setBookings] = React.useState([]);
            const [selectedDate, setSelectedDate] = React.useState(null);
            const [selectedPackage, setSelectedPackage] = React.useState('small');
            const [isRegistering, setIsRegistering] = React.useState(!profile);

            React.useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                return onAuthStateChanged(auth, setUser);
            }, []);

            React.useEffect(() => {
                if (!user) return;
                // ВАЖЛИВО: Колекція 'orders' має бути однаковою скрізь
                const q = collection(db, 'orders');
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setBookings(data);
                });
                return () => unsubscribe();
            }, [user]);

            React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const getCalendarMonths = () => {
                const months = {};
                const weekDays = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
                for(let i = 1; i <= 14; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    const monthName = d.toLocaleString('uk-UA', { month: 'long' });
                    const dateStr = d.toISOString().split('T')[0];
                    if (!months[monthName]) months[monthName] = [];
                    months[monthName].push({ 
                        date: dateStr, 
                        day: d.getDate(),
                        weekday: weekDays[d.getDay()]
                    });
                }
                return months;
            };

            const createOrder = async () => {
                if (!selectedDate) return;
                if (bookings.some(b => b.date === selectedDate)) {
                    alert("Ця дата вже зайнята!");
                    return;
                }
                await addDoc(collection(db, 'orders'), {
                    room: profile.room,
                    clientName: profile.name,
                    date: selectedDate,
                    package: selectedPackage,
                    status: 'Прийнято',
                    createdAt: serverTimestamp(),
                    returnDateInfo: 'Очікуйте оновлення статусу'
                });
                setSelectedDate(null);
            };

            if (isRegistering) {
                return React.createElement('div', { className: "min-h-screen bg-gray-900 text-white flex items-center justify-center p-4 font-sans" },
                    React.createElement('form', { onSubmit: (e) => {
                        e.preventDefault();
                        const name = e.target.name.value;
                        const room = e.target.room.value;
                        const isAdmin = name === ADMIN_PASSWORD;
                        const newUser = { room: isAdmin ? 'ADMIN' : room, name, isAdmin };
                        localStorage.setItem('laundry_user', JSON.stringify(newUser));
                        setProfile(newUser);
                        setIsRegistering(false);
                    }, className: "bg-gray-800 p-8 rounded-3xl w-full max-w-md border border-gray-700 shadow-2xl" },
                        React.createElement('h1', { className: "text-2xl font-bold mb-6 text-blue-400 text-center" }, "Вхід"),
                        React.createElement('input', { name: "room", required: true, placeholder: "Номер хати", className: "w-full p-4 mb-4 bg-gray-700 rounded-xl outline-none" }),
                        React.createElement('input', { name: "name", required: true, placeholder: "Ім'я (або пароль)", className: "w-full p-4 mb-6 bg-gray-700 rounded-xl outline-none" }),
                        React.createElement('button', { className: "w-full bg-blue-600 py-4 rounded-xl font-bold" }, "Увійти")
                    )
                );
            }

            if (profile?.isAdmin) {
                return React.createElement('div', { className: "p-4 bg-gray-900 min-h-screen text-white font-sans" },
                    React.createElement('div', { className: "flex justify-between items-center mb-6" },
                        React.createElement('h1', { className: "text-xl font-bold text-yellow-500" }, "Адмін-панель"),
                        React.createElement('button', { onClick: () => { localStorage.clear(); location.reload(); } }, React.createElement('i', { 'data-lucide': "log-out" }))
                    ),
                    bookings.length === 0 ? React.createElement('p', {className: "text-gray-500"}, "Замовлень немає") :
                    bookings.sort((a,b) => b.date.localeCompare(a.date)).map(order => React.createElement('div', { key: order.id, className: "bg-gray-800 p-4 mb-3 rounded-2xl border border-gray-700 shadow-lg" },
                        React.createElement('div', { className: "flex justify-between" },
                            React.createElement('div', null,
                                React.createElement('div', { className: "font-bold" }, `Хата ${order.room}: ${order.clientName}`),
                                React.createElement('div', { className: "text-blue-400 text-sm" }, `${order.date} — ${PACKAGES[order.package]?.label}`)
                            ),
                            React.createElement('button', { onClick: () => deleteDoc(doc(db, 'orders', order.id)), className: "text-red-500 p-2" }, React.createElement('i', { 'data-lucide': "trash-2", className: "w-5 h-5" }))
                        )
                    ))
                );
            }

            const myOrders = bookings.filter(b => b.room === profile.room && b.clientName === profile.name);
            const calendar = getCalendarMonths();

            return React.createElement('div', { className: "min-h-screen bg-gray-900 text-white font-sans pb-10" },
                React.createElement('header', { className: "p-6 bg-gray-800 flex justify-between items-center shadow-md mb-6" },
                    React.createElement('div', null,
                        React.createElement('h1', { className: "text-lg font-bold text-blue-400" }, profile.name),
                        React.createElement('p', { className: "text-xs text-gray-400" }, `Хата ${profile.room}`)
                    ),
                    React.createElement('button', { onClick: () => { localStorage.clear(); location.reload(); } }, React.createElement('i', { 'data-lucide': "log-out", className: "text-gray-400" }))
                ),
                
                React.createElement('main', { className: "max-w-md mx-auto px-4 space-y-6" },
                    myOrders.length > 0 && React.createElement('section', null,
                        React.createElement('h2', { className: "text-[10px] font-bold uppercase text-gray-500 mb-3 tracking-widest" }, "Мої записи"),
                        myOrders.map(order => React.createElement('div', { key: order.id, className: "bg-gray-800 p-4 rounded-2xl border-l-4 border-blue-500 mb-2 shadow-md" },
                            React.createElement('div', { className: "flex justify-between" },
                                React.createElement('span', { className: "font-bold text-sm" }, PACKAGES[order.package]?.label),
                                React.createElement('span', { className: "text-[10px] bg-blue-900 px-2 py-1 rounded-full" }, order.status)
                            ),
                            React.createElement('div', { className: "text-xs text-gray-400 mt-1" }, order.date)
                        ))
                    ),

                    React.createElement('section', { className: "bg-gray-800 p-6 rounded-3xl border border-gray-700 shadow-2xl" },
                        React.createElement('h2', { className: "text-lg font-bold mb-4" }, "Запис на прання"),
                        
                        React.createElement('div', { className: "space-y-2 mb-6" },
                            Object.entries(PACKAGES).map(([key, pkg]) => React.createElement('button', {
                                key: key,
                                onClick: () => setSelectedPackage(key),
                                className: `w-full p-4 rounded-2xl border-2 text-left transition-all ${selectedPackage === key ? 'border-blue-500 bg-blue-600/10' : 'border-gray-700'}`
                            }, 
                                React.createElement('div', { className: "font-bold text-sm" }, pkg.label),
                                React.createElement('div', { className: "text-[10px] text-gray-400" }, pkg.desc)
                            ))
                        ),

                        Object.entries(calendar).map(([month, days]) => React.createElement('div', { key: month, className: "mb-6" },
                            React.createElement('h3', { className: "text-xs font-bold text-gray-500 mb-3 capitalize" }, month),
                            React.createElement('div', { className: "grid grid-cols-4 gap-2" },
                                days.map(d => {
                                    const isBooked = bookings.some(b => b.date === d.date);
                                    return React.createElement('button', {
                                        key: d.date,
                                        disabled: isBooked,
                                        onClick: () => setSelectedDate(d.date),
                                        className: `p-2 rounded-xl flex flex-col items-center transition-all ${
                                            selectedDate === d.date ? 'bg-blue-600' : 
                                            isBooked ? 'bg-red-900/40 text-red-500' : 'bg-gray-700'
                                        }`
                                    }, 
                                        React.createElement('span', {className: "text-sm font-bold"}, d.day),
                                        React.createElement('span', {className: "text-[9px] opacity-50"}, d.weekday)
                                    )
                                })
                            )
                        )),

                        React.createElement('button', { 
                            onClick: createOrder, 
                            disabled: !selectedDate, 
                            className: "w-full bg-green-600 py-4 rounded-2xl font-bold shadow-lg disabled:opacity-10 transition-all" 
                        }, "Підтвердити запис")
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</head>
<body class="bg-gray-900"><div id="root"></div></body>
</html>
