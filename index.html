<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запис на прання</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const PKG = { 
            small: { n: 'До 5 кг речей', d: 24 }, 
            medium: { n: '5 - 10 кг речей', d: 48 }, 
            large: { n: 'Більше 10 кг речей', d: 72 } 
        };
        const WD = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        function App() {
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('l_u')));
            const [bookings, setBookings] = React.useState([]);
            const [selD, setSelD] = React.useState(null);
            const [selP, setSelP] = React.useState('small');
            const [now, setNow] = React.useState(Date.now());

            React.useEffect(() => {
                signInAnonymously(auth);
                const timer = setInterval(() => setNow(Date.now()), 30000);
                const unsub = onSnapshot(collection(db, 'orders'), s => {
                    setBookings(s.docs.map(d => ({ id: d.id, ...d.data() })));
                }, () => {});
                return () => { clearInterval(timer); unsub(); };
            }, []);

            const getT = (t) => {
                if (!t) return "--";
                const diff = t - now;
                if (diff <= 0) return "ГОТОВО";
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                return `${h}г ${m}хв`;
            };

            const fD = d => d ? d.split('-').reverse().slice(0,2).join('.') : '??.??';

            if (!profile) return React.createElement('div', { className: "min-h-screen bg-black text-white flex flex-col justify-center p-8 font-sans" },
                React.createElement('div', { onClick: () => { if(prompt('?')==='Tokyo') { const a={adm:true, n:'Адмін', r:'ADM'}; setProfile(a); localStorage.setItem('l_u', JSON.stringify(a)); } }, className: "absolute top-0 right-0 w-20 h-20" }),
                React.createElement('h1', { className: "text-2xl font-black text-blue-500 mb-8 text-center uppercase tracking-tighter" }, "Авторизація"),
                React.createElement('input', { id: "n", placeholder: "Ваше ім'я", className: "p-4 mb-4 bg-gray-900 rounded-2xl border border-gray-800 text-white outline-none" }),
                React.createElement('input', { id: "r", type: "number", placeholder: "Камера", className: "p-4 mb-6 bg-gray-900 rounded-2xl border border-gray-800 text-white outline-none" }),
                React.createElement('button', { 
                    onClick: () => {
                        const n = document.getElementById('n').value.trim(), r = document.getElementById('r').value;
                        if(n && r) { const u={n, r, adm:false}; localStorage.setItem('l_u', JSON.stringify(u)); setProfile(u); }
                    }, className: "bg-blue-600 py-4 rounded-2xl font-black uppercase" 
                }, "УВІЙТИ")
            );

            if (profile.adm) return React.createElement('div', { className: "p-4 bg-black min-h-screen text-white font-sans" },
                React.createElement('div', { className: "flex justify-between mb-6 items-center" }, React.createElement('b', {className:"text-yellow-500 text-xl font-black uppercase"}, "Адмін"), React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"text-red-500 text-[10px] font-black uppercase"}, "Вихід")),
                bookings.sort((a,b)=>(a.d||a.date||"").localeCompare(b.d||b.date||"")).map(b => React.createElement('div', { key: b.id, className: "bg-gray-900 p-5 mb-4 rounded-[2rem] border border-gray-800" },
                    React.createElement('div', { className: "flex justify-between" },
                        React.createElement('div', null,
                            React.createElement('div', {className:"font-bold text-lg"}, `${b.r || b.room} — ${b.n || b.clientName}`),
                            React.createElement('div', {className:"text-blue-400 text-xs font-bold"}, `${fD(b.d || b.date)} | ${PKG[b.package]?.n}`)
                        ),
                        React.createElement('button', {onClick:()=>deleteDoc(doc(db,'orders',b.id)), className:"p-2 text-xl"}, "🗑️")
                    ),
                    !b.finishAt ? React.createElement('button', {
                        onClick: () => {
                            const wait = (b.package === 'medium' && bookings.filter(x => (x.d === b.d || x.date === b.date) && x.package === 'medium').length > 1) ? 72 : PKG[b.package].d;
                            updateDoc(doc(db,'orders',b.id), {status:'Підтверджено', finishAt: Date.now() + (wait * 3600000)});
                        }, className:"w-full mt-4 bg-blue-600 p-3 rounded-2xl text-[10px] font-black uppercase tracking-widest"
                    }, "Підтвердити") : React.createElement('div', {className:"mt-4 flex justify-between items-center border-t border-white/5 pt-3"},
                        React.createElement('span', {className:"text-green-500 font-black uppercase text-[10px] tracking-widest"}, `В РОБОТІ: ${getT(b.finishAt)}`),
                        React.createElement('button', {
                            onClick: () => {
                                const h = prompt("Змінити час (годин від зараз)?");
                                if(h) updateDoc(doc(db,'orders',b.id), {finishAt: Date.now() + (parseInt(h) * 3600000)});
                            }, className:"text-gray-500 text-lg"
                        }, "✏️")
                    )
                ))
            );

            const my = bookings.filter(b => (b.r || b.room) === profile.r && (b.n || b.clientName || "").toLowerCase() === profile.n.toLowerCase());
            
            return React.createElement('div', { className: "min-h-screen bg-black text-white pb-10 font-sans" },
                React.createElement('header', { className: "p-6 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur-lg z-50 border-b border-white/5" },
                    React.createElement('div', null, React.createElement('b', {className:"text-blue-500 text-xl font-black uppercase"}, profile.n), React.createElement('p', {className:"text-[10px] text-gray-500 uppercase font-bold mt-0.5"}, `Камера ${profile.r}`)),
                    React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"bg-gray-900 px-4 py-2 rounded-xl text-[10px] font-black uppercase"}, "Вихід")
                ),
                React.createElement('main', { className: "p-4 space-y-6 max-w-2xl mx-auto" },
                    my.map(o => {
                        const dP = (o.d || o.date || "2024-01-01").split('-');
                        const mTime = new Date(dP[0], dP[1]-1, dP[2], 6, 0, 0).getTime();
                        const isAfterMorning = now > mTime;
                        return React.createElement('div', { key: o.id, className: "w-full bg-gray-900 rounded-[2.5rem] border border-gray-800 overflow-hidden shadow-2xl" },
                            React.createElement('div', { className: `p-2 text-[10px] font-black text-center tracking-widest ${o.finishAt && isAfterMorning ? 'bg-green-600/20 text-green-500' : o.finishAt ? 'bg-blue-600/20 text-blue-400' : 'bg-orange-600/20 text-orange-500'}` },
                                (o.finishAt && isAfterMorning) ? '✅ ПОВЕРНЕННЯ' : o.finishAt ? '👕 ВИСТАВИТИ РЕЧІ' : '⏳ ОЧІКУВАННЯ'
                            ),
                            React.createElement('div', {className:"p-6 flex justify-between items-center"},
                                React.createElement('div', null, React.createElement('p', {className:"font-black text-lg leading-none"}, PKG[o.package]?.n), React.createElement('p', {className:"text-xs text-gray-500 mt-1 font-bold font-sans uppercase"}, fD(o.d || o.date))),
                                React.createElement('div', {className:"text-right"}, 
                                    React.createElement('p', {className:"text-[10px] text-gray-500 uppercase font-bold mb-0.5"}, (o.finishAt && isAfterMorning) ? "Буде готово" : o.finishAt ? "До 06:00 ранку" : "Очікування"),
                                    React.createElement('p', {className: `${o.finishAt ? 'text-blue-400' : 'text-gray-600'} font-black text-2xl tracking-tighter leading-none`}, 
                                        (o.finishAt && isAfterMorning) ? getT(o.finishAt) : o.finishAt ? getT(mTime) : `~ ${PKG[o.package]?.d} год.`
                                    )
                                )
                            )
                        );
                    }),
                    React.createElement('div', { className: "bg-gray-900 p-6 rounded-[3rem] border border-gray-800" },
                        React.createElement('h2', {className:"text-center text-gray-500 text-[11px] font-black uppercase mb-4 tracking-widest"}, "Оберіть дату"),
                        React.createElement('div', { className: "grid grid-cols-5 gap-3 mb-8" }, Array.from({length:10}, (_,i)=>{
                            const d = new Date(); d.setDate(d.getDate()+i+1); const ds = d.toISOString().split('T')[0];
                            const dayB = bookings.filter(b => b.d === ds || b.date === ds);
                            const isFull = (selP==='large' && dayB.some(b=>b.package==='large')) || (selP==='medium' && dayB.filter(b=>b.package==='medium').length>=2) || (selP==='small' && dayB.filter(b=>b.package==='small').length>=2);
                            return React.createElement('button', {
                                key:ds, disabled:isFull, onClick:()=>setSelD(ds),
                                className:`aspect-square rounded-2xl flex flex-col items-center justify-center transition-all ${selD===ds?'bg-blue-600 scale-105':isFull?'opacity-10 cursor-not-allowed':'bg-black/40 border border-white/5'}`
                            }, React.createElement('span', {className:"text-[10px] opacity-50 font-black"}, WD[d.getDay()]), React.createElement('span', {className:"font-black text-lg"}, d.getDate()));
                        })),
                        Object.entries(PKG).map(([k, p]) => React.createElement('button', {
                            key: k, onClick: () => { setSelP(k); setSelD(null); },
                            className: `p-5 rounded-[2rem] border-2 w-full text-left mb-3 flex justify-between items-center ${selP === k ? 'border-blue-600 bg-blue-600/5' : 'border-transparent bg-black/20 opacity-40'}`
                        }, React.createElement('p', {className:"font-black text-sm"}, p.n), React.createElement('p', {className:"text-[10px] font-black text-gray-500 uppercase"}, `~ ${p.d} год.`))),
                        React.createElement('button', { 
                            onClick: () => {
                                addDoc(collection(db,'orders'), {r:profile.r, n:profile.n, d:selD, package:selP, status:'Новий', createdAt:serverTimestamp()});
                                setSelD(null); window.scrollTo({top:0, behavior:'smooth'});
                            },
                            disabled: !selD, className: "w-full bg-blue-600 py-5 rounded-[2rem] font-black text-lg mt-5 disabled:opacity-10 uppercase shadow-xl"
                        }, "ЗАПИСАТИСЯ")
                    )
                )
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</head>
<body class="bg-black text-white"><div id="root"></div></body>
</html>
