<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запис на прання</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c",
            measurementId: "G-N33YNQTN3B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const appId = 'my-laundry-orders'; 
        const ADMIN_PASSWORD = "Tokyo";

        const PACKAGES = {
            small: { label: 'Малий пакет', units: 1, desc: 'До 3кг. Повернення ~24 год.' },
            medium: { label: 'Середній пакет', units: 2, desc: '3-6кг. Повернення ~24-48 год.' },
            large: { label: 'Великий пакет', units: 4, desc: '6кг+. Займає 2 дні.' }
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('laundry_user')) || null);
            const [bookings, setBookings] = React.useState([]);
            const [selectedDate, setSelectedDate] = React.useState(null);
            const [selectedPackage, setSelectedPackage] = React.useState('small');
            const [isRegistering, setIsRegistering] = React.useState(!profile);
            const [isAdmin, setIsAdmin] = React.useState(profile?.isAdmin || false);

            React.useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                return onAuthStateChanged(auth, setUser);
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const q = collection(db, 'orders');
                return onSnapshot(q, (snapshot) => {
                    setBookings(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
            }, [user]);

            React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const handleRegister = (e) => {
                e.preventDefault();
                const name = e.target.name.value;
                const room = e.target.room.value;
                const isBoss = name === ADMIN_PASSWORD;
                const newUser = { room: isBoss ? 'ADMIN' : room, name, isAdmin: isBoss };
                localStorage.setItem('laundry_user', JSON.stringify(newUser));
                setProfile(newUser);
                setIsAdmin(isBoss);
                setIsRegistering(false);
            };

            const getDayLoad = (dateStr) => {
                return bookings.filter(b => b.date === dateStr).reduce((sum, b) => sum + (Number(b.units) || 0), 0);
            };

            // ГЕНЕРАЦІЯ ДАТ: Починаючи з завтрашнього дня (+1)
            const calendarDays = [];
            for(let i=1; i<=10; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                calendarDays.push(d.toISOString().split('T')[0]);
            }

            const createOrder = async () => {
                if (!selectedDate) return;
                await addDoc(collection(db, 'orders'), {
                    room: profile.room,
                    clientName: profile.name,
                    date: selectedDate,
                    package: selectedPackage,
                    units: PACKAGES[selectedPackage].units,
                    status: 'pending',
                    createdAt: serverTimestamp(),
                    returnDateInfo: 'Очікує підтвердження'
                });
                alert('Записано!');
                setSelectedDate(null);
            };

            if (isRegistering) {
                return React.createElement('div', { className: "min-h-screen bg-gray-900 text-white flex items-center justify-center p-4" },
                    React.createElement('form', { onSubmit: handleRegister, className: "bg-gray-800 p-8 rounded-2xl w-full max-w-md" },
                        React.createElement('h1', { className: "text-2xl font-bold mb-6 text-blue-400" }, "Вхід"),
                        React.createElement('input', { name: "room", placeholder: "Номер хати", className: "w-full p-3 mb-4 bg-gray-700 rounded" }),
                        React.createElement('input', { name: "name", placeholder: "Ваше ім'я (або пароль адміна)", className: "w-full p-3 mb-6 bg-gray-700 rounded" }),
                        React.createElement('button', { className: "w-full bg-blue-600 py-3 rounded font-bold" }, "Увійти")
                    )
                );
            }

            if (isAdmin) {
                return React.createElement('div', { className: "p-4 bg-gray-900 min-h-screen text-white" },
                    React.createElement('h1', { className: "text-xl font-bold text-yellow-500 mb-4" }, "Адмінка"),
                    bookings.map(order => React.createElement('div', { key: order.id, className: "bg-gray-800 p-4 mb-2 rounded border border-gray-700" },
                        React.createElement('div', null, `Хата ${order.room}: ${order.clientName}`),
                        React.createElement('div', { className: "text-sm text-blue-400" }, `${order.date} - ${order.package}`),
                        React.createElement('button', { onClick: () => deleteDoc(doc(db, 'orders', order.id)), className: "text-red-500 mt-2 text-xs" }, "Видалити")
                    )),
                    React.createElement('button', { onClick: () => { localStorage.clear(); location.reload(); }, className: "mt-10 text-gray-500" }, "Вийти")
                );
            }

            return React.createElement('div', { className: "min-h-screen bg-gray-900 text-white p-4" },
                React.createElement('header', { className: "mb-6" }, 
                    React.createElement('h1', { className: "text-xl font-bold" }, `Вітаємо, ${profile.name}`),
                    React.createElement('p', { className: "text-gray-400" }, "Оберіть день для прання (запис тільки від завтра)")
                ),
                React.createElement('div', { className: "space-y-4" },
                    Object.entries(PACKAGES).map(([key, pkg]) => React.createElement('button', {
                        key: key,
                        onClick: () => setSelectedPackage(key),
                        className: `w-full p-4 rounded-xl border-2 text-left ${selectedPackage === key ? 'border-blue-500' : 'border-gray-700'}`
                    }, pkg.label)),
                    React.createElement('div', { className: "grid grid-cols-2 gap-2" },
                        calendarDays.map(date => React.createElement('button', {
                            key: date,
                            onClick: () => setSelectedDate(date),
                            className: `p-3 rounded-xl ${selectedDate === date ? 'bg-blue-600' : 'bg-gray-800'}`
                        }, date))
                    ),
                    React.createElement('button', { onClick: createOrder, disabled: !selectedDate, className: "w-full bg-green-600 py-4 rounded-xl font-bold disabled:opacity-20" }, "Забронювати")
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</head>
<body class="bg-gray-900"><div id="root"></div></body>
</html>
