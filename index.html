<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запис на прання</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const PKG = { 
            small: { n: 'До 5 кг', d: '~ 1 день', h: 24 }, 
            medium: { n: '5 - 10 кг', d: '~ 2 дні', h: 48 }, 
            large: { n: 'Більше 10 кг', d: '~ 3 дні', h: 72 } 
        };
        const WD = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        function App() {
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('l_u')));
            const [bookings, setBookings] = React.useState([]);
            const [selD, setSelD] = React.useState(null);
            const [selP, setSelP] = React.useState('small');
            const [now, setNow] = React.useState(Date.now());

            React.useEffect(() => {
                signInAnonymously(auth);
                const timer = setInterval(() => setNow(Date.now()), 60000);
                const unsub = onSnapshot(collection(db, 'orders'), s => {
                    setBookings(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => { clearInterval(timer); unsub(); };
            }, []);

            const isV = r => { const n = parseInt(r); return (n >= 90 && n <= 121) || (n >= 340 && n <= 344); };
            const getT = f => {
                if (!f) return null;
                const d = f - now;
                return d <= 0 ? "ГОТОВО" : `~ ${Math.ceil(d / 3600000)} год.`;
            };

            if (!profile) return React.createElement('div', { className: "min-h-screen bg-black text-white flex flex-col justify-center p-8 font-sans" },
                React.createElement('div', { onClick: () => { if(prompt('?')==='Tokyo') { const a={adm:true}; setProfile(a); localStorage.setItem('l_u', JSON.stringify(a)); } }, className: "absolute top-0 right-0 w-20 h-20" }),
                React.createElement('h1', { className: "text-2xl font-black text-blue-500 mb-8 text-center uppercase tracking-tighter" }, "Авторизація"),
                React.createElement('input', { id: "n", placeholder: "Ваше ім'я", className: "p-4 mb-4 bg-gray-900 rounded-2xl outline-none border border-gray-800" }),
                React.createElement('input', { id: "r", type: "number", placeholder: "Номер камери", className: "p-4 mb-6 bg-gray-900 rounded-2xl outline-none border border-gray-800" }),
                React.createElement('button', { 
                    onClick: () => {
                        const n = document.getElementById('n').value, r = document.getElementById('r').value;
                        if(n && isV(r)) { const u = {n, r, adm:false}; localStorage.setItem('l_u', JSON.stringify(u)); setProfile(u); }
                    }, className: "bg-blue-600 py-4 rounded-2xl font-bold active:scale-95 transition" 
                }, "УВІЙТИ")
            );

            if (profile.adm) return React.createElement('div', { className: "p-4 bg-black min-h-screen text-white font-sans" },
                React.createElement('div', { className: "flex justify-between mb-6 items-center" }, React.createElement('b', {className:"text-yellow-500 text-xl font-black uppercase"}, "Адмін"), React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"text-red-500 text-xs font-bold font-sans"}, "ВИХІД")),
                bookings.length === 0 && React.createElement('p', {className:"text-center text-gray-500 mt-10"}, "Замовлень поки немає"),
                bookings.sort((a,b)=>a.date.localeCompare(b.date)).map(b => React.createElement('div', { key: b.id, className: "bg-gray-900 p-5 mb-4 rounded-3xl border border-gray-800" },
                    React.createElement('div', { className: "flex justify-between" },
                        React.createElement('div', null,
                            React.createElement('div', {className:"font-bold text-lg leading-none"}, `${b.room || b.r} — ${b.clientName || b.n}`),
                            React.createElement('div', {className:"text-blue-400 text-xs mt-1 font-bold"}, `${b.date.split('-')[2]}.${b.date.split('-')[1]} | ${PKG[b.package]?.n}`),
                            React.createElement('div', {className:"text-gray-500 text-[10px] italic mt-2 opacity-60 font-sans leading-relaxed"}, b.note || "виставляйте стірку по мусору")
                        ),
                        React.createElement('button', {onClick:()=>deleteDoc(doc(db,'orders',b.id)), className:"p-2 text-xl"}, "🗑️")
                    ),
                    !b.finishAt ? React.createElement('button', {
                        onClick: () => {
                            const hrs = prompt("Скільки годин до повернення?");
                            if(hrs) {
                                const start = new Date(b.date); start.setHours(7,0,0,0);
                                const f = Math.max(Date.now(), start.getTime()) + (parseInt(hrs) * 3600000);
                                updateDoc(doc(db,'orders',b.id), {status:'Підтверджено', finishAt: f, note: prompt("Коментар (або пустим)?") || ""});
                            }
                        }, className:"w-full mt-4 bg-green-600 p-3 rounded-2xl text-xs font-black uppercase tracking-widest"
                    }, "Підтвердити") : React.createElement('div', {className:"mt-4 text-green-500 font-black text-center border-t border-white/5 pt-3"}, getT(b.finishAt))
                ))
            );

            const my = bookings.filter(b => (b.room || b.r) === profile.r && (b.clientName || b.n) === profile.n);
            const today = new Date();
            const monthName = today.toLocaleString('uk-UA', { month: 'long' });

            return React.createElement('div', { className: "min-h-screen bg-black text-white pb-10 font-sans" },
                React.createElement('header', { className: "p-6 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur-lg z-50 border-b border-white/5" },
                    React.createElement('div', null, React.createElement('b', {className:"text-blue-500 text-xl font-black"}, profile.n), React.createElement('p', {className:"text-[10px] text-gray-500 uppercase font-bold tracking-widest mt-0.5"}, `Камера ${profile.r}`)),
                    React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"bg-gray-900 px-4 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/5"}, "Вихід")
                ),
                React.createElement('main', { className: "p-4 space-y-6 max-w-2xl mx-auto" },
                    my.length > 0 && React.createElement('div', { className: "space-y-4" },
                        my.map(o => React.createElement('div', { key: o.id, className: "w-full bg-gray-900 rounded-[2.5rem] border border-gray-800 overflow-hidden shadow-2xl" },
                            React.createElement('div', { className: `p-2 text-[10px] font-black text-center tracking-widest ${o.finishAt ? 'bg-green-600/20 text-green-500' : 'bg-orange-600/20 text-orange-500'}` },
                                o.finishAt ? '✅ ПІДТВЕРДЖЕНО' : '⏳ ОЧІКУВАННЯ ПІДТВЕРДЖЕННЯ'
                            ),
                            React.createElement('div', {className:"p-6 flex justify-between items-center"},
                                React.createElement('div', null, 
                                    React.createElement('p', {className:"font-black text-lg leading-none"}, PKG[o.package]?.n), 
                                    React.createElement('p', {className:"text-xs text-gray-500 mt-1 font-bold"}, `${o.date.split('-')[2]}.${o.date.split('-')[1]}`)
                                ),
                                o.finishAt && React.createElement('div', {className:"text-right"},
                                    React.createElement('p', {className:"text-[10px] text-gray-500 uppercase font-bold mb-0.5"}, "Повернення"),
                                    React.createElement('p', {className:"text-blue-400 font-black text-2xl tracking-tighter"}, getT(o.finishAt))
                                )
                            ),
                            React.createElement('p', {className:"px-6 pb-6 text-[11px] text-gray-400 italic opacity-70 leading-relaxed"}, o.note || "виставляйте стірку по мусору")
                        ))
                    ),
                    React.createElement('div', { className: "bg-gray-900 p-6 rounded-[3rem] border border-gray-800" },
                        React.createElement('h2', {className:"text-center text-gray-500 text-[11px] font-black uppercase tracking-[0.2em] mb-4"}, monthName),
                        React.createElement('div', { className: "grid grid-cols-5 gap-3 mb-8" }, Array.from({length:10}, (_,i)=>{
                            const d = new Date(); d.setDate(d.getDate()+i+1); 
                            const ds = d.toISOString().split('T')[0];
                            const isB = bookings.some(b => b.date === ds);
                            return React.createElement('button', {
                                key:ds, disabled:isB, onClick:()=>setSelD(ds),
                                className:`aspect-square rounded-2xl flex flex-col items-center justify-center transition-all ${selD===ds?'bg-blue-600 scale-105':isB?'opacity-10':'bg-black/40 border border-white/5 active:scale-95'}`
                            }, 
                                React.createElement('span', {className:"text-[10px] opacity-50 font-black mb-0.5"}, WD[d.getDay()]),
                                React.createElement('span', {className:"font-black text-lg leading-none"}, d.getDate())
                            );
                        })),
                        React.createElement('div', {className:"space-y-3"},
                            Object.entries(PKG).map(([k, p]) => React.createElement('button', {
                                key: k, onClick: () => setSelP(k),
                                className: `p-5 rounded-[2rem] border-2 w-full text-left transition-all flex justify-between items-center ${selP === k ? 'border-blue-600 bg-blue-600/5' : 'border-transparent bg-black/20 opacity-40'}`
                            }, 
                                React.createElement('div', null, React.createElement('p', {className:"font-black text-sm"}, p.n)),
                                React.createElement('div', {className:"text-[10px] font-black text-gray-500 uppercase tracking-widest"}, p.d)
                            ))
                        ),
                        React.createElement('button', { 
                            onClick: () => addDoc(collection(db,'orders'), {r:profile.r, n:profile.n, date:selD, package:selP, status:'Новий', createdAt:serverTimestamp()}),
                            disabled: !selD, className: "w-full bg-blue-600 py-5 rounded-[2rem] font-black text-lg mt-8 disabled:opacity-10 active:scale-95 shadow-xl shadow-blue-600/20 uppercase tracking-tighter"
                        }, "ЗАПИСАТИСЯ")
                    )
                )
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
    <style> body { background: black; color: white; -webkit-tap-highlight-color: transparent; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; } </style>
</head>
<body><div id="root"></div></body>
</html>
