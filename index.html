<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Запис на прання</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

/* ---------------- FIREBASE CONFIG ---------------- */
const firebaseConfig = {
apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
authDomain: "my-laundry-84f8b.firebaseapp.com",
projectId: "my-laundry-84f8b",
storageBucket: "my-laundry-84f8b.firebasestorage.app",
messagingSenderId: "524025568005",
appId: "1:524025568005:web:65f72b000e8db75938f56c",
measurementId: "G-N33YNQTN3B"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_PASSWORD = "Tokyo";

const PACKAGES = {
small: { label: 'Малий пакет' },
medium: { label: 'Середній пакет' },
large: { label: 'Великий пакет' }
};

function App(){

const [user,setUser]=React.useState(null);
const [profile,setProfile]=React.useState(()=>JSON.parse(localStorage.getItem('laundry_user'))||null);
const [bookings,setBookings]=React.useState([]);
const [selectedDate,setSelectedDate]=React.useState(null);
const [selectedPackage,setSelectedPackage]=React.useState('small');
const [isRegistering,setIsRegistering]=React.useState(!profile);

const [regName,setRegName]=React.useState('');
const [regRoom,setRegRoom]=React.useState('');

React.useEffect(()=>{
signInAnonymously(auth);
return onAuthStateChanged(auth,setUser);
},[]);

React.useEffect(()=>{
if(!user)return;
return onSnapshot(collection(db,'orders'),snapshot=>{
setBookings(snapshot.docs.map(doc=>({id:doc.id,...doc.data()})));
});
},[user]);

const isRoomValid=(room)=>{
const r=parseInt(room);
return (r>=90&&r<=121)||(r>=340&&r<=344);
};

const getCalendarDays=()=>{
const days=[];
for(let i=1;i<=10;i++){
const d=new Date();
d.setDate(d.getDate()+i);
days.push({
date:d.toISOString().split('T')[0],
day:d.getDate()
});
}
return days;
};

/* ---------------- REGISTRATION ---------------- */
if(isRegistering){
const showWarning=regRoom!==''&&!isRoomValid(regRoom);

return (
<div className="min-h-screen bg-black text-white flex items-center justify-center p-6 relative">
<div onClick={()=>{
const pass=prompt("Пароль:");
if(pass==="Tokyo"){
const adminUser={room:'ADMIN',name:'Адмін',isAdmin:true};
localStorage.setItem('laundry_user',JSON.stringify(adminUser));
setProfile(adminUser);
setIsRegistering(false);
}
}} className="absolute top-0 right-0 w-20 h-20"/>

<form onSubmit={(e)=>{
e.preventDefault();
if(!isRoomValid(regRoom))return;
const newUser={room:regRoom,name:regName,isAdmin:false};
localStorage.setItem('laundry_user',JSON.stringify(newUser));
setProfile(newUser);
setIsRegistering(false);
}}
className="bg-gray-900 p-8 rounded-3xl w-full max-w-sm">

<h1 className="text-2xl font-bold mb-6 text-blue-500 text-center">Запис на прання</h1>

<input value={regName} onChange={e=>setRegName(e.target.value)} required placeholder="Ваше ім'я"
className="w-full p-4 mb-4 bg-gray-800 rounded-2xl"/>

<input type="number" value={regRoom} onChange={e=>setRegRoom(e.target.value)} required placeholder="Номер камери"
className="w-full p-4 mb-2 bg-gray-800 rounded-2xl"/>

{showWarning && <div className="text-xs text-red-400 mb-4">
Ця камера не може резервувати дні онлайн.
</div>}

<button disabled={showWarning||!regName||!regRoom}
className="w-full bg-blue-600 disabled:bg-gray-700 py-4 rounded-2xl font-bold">
Увійти
</button>

</form>
</div>
);
}

/* ---------------- ADMIN ---------------- */
if(profile?.isAdmin){

const days=getCalendarDays();

return (
<div className="min-h-screen bg-black text-white p-6">

<div className="flex justify-between mb-6">
<h1 className="text-yellow-500 font-bold">Адмін-панель</h1>
<button onClick={()=>{localStorage.clear();location.reload();}}
className="text-red-500">ВИЙТИ</button>
</div>

<div className="grid grid-cols-5 gap-4">
{days.map(day=>{
const dayOrders=bookings.filter(b=>b.date===day.date);
return(
<div key={day.date} className="bg-gray-900 p-4 rounded-2xl">
<div className="font-bold mb-2">{day.day}</div>
{dayOrders.map(order=>(
<div key={order.id} className="text-xs mb-2 p-2 bg-gray-800 rounded-xl">
<div>Камера {order.room}</div>

<div className="flex gap-2 mt-1">
<button onClick={()=>updateDoc(doc(db,'orders',order.id),{
status:'Підтверджено'
})}
className="text-green-400">✔</button>

<button onClick={()=>updateDoc(doc(db,'orders',order.id),{
status:'Відхилено'
})}
className="text-red-400">✖</button>
</div>
</div>
))}
</div>
);
})}
</div>

</div>
);
}

/* ---------------- USER ---------------- */
const myOrders=bookings.filter(b=>b.room===profile.room);

const days=getCalendarDays();

return (
<div className="min-h-screen bg-black text-white p-6">

<div className="flex justify-between mb-6">
<div>
<h1 className="text-blue-500 font-bold">{profile.name}</h1>
<div className="text-xs text-gray-500">Камера {profile.room}</div>
</div>
<button onClick={()=>{localStorage.clear();location.reload();}}
className="text-red-500">Вийти</button>
</div>

{/* МОЇ ЗАМОВЛЕННЯ */}
<div className="grid grid-cols-5 gap-4 mb-8">
{days.map(day=>{
const order=myOrders.find(o=>o.date===day.date);
return(
<div key={day.date} className="bg-gray-900 p-4 rounded-2xl text-center">

<div className="font-bold">{day.day}</div>

{order && (
<div className="mt-2 text-xs">
{order.status==='Очікування' || !order.status ? (
<span className="text-yellow-400">Очікування підтвердження</span>
) : order.status==='Підтверджено' ? (
<span className="text-green-400">Підтверджено ✔</span>
) : order.status==='Відхилено' ? (
<span className="text-red-400">Відхилено ✖</span>
) : order.status}
</div>
)}

</div>
);
})}
</div>

{/* ВИБІР ДАТИ */}
<h2 className="mb-4 font-bold">Оберіть дату</h2>
<div className="grid grid-cols-5 gap-3 mb-6">
{days.map(d=>(
<button key={d.date}
onClick={()=>setSelectedDate(d.date)}
className={`p-4 rounded-xl ${selectedDate===d.date?'bg-blue-600':'bg-gray-800'}`}>
{d.day}
</button>
))}
</div>

{/* ВИБІР ПАКЕТУ */}
<div className="mb-6">
{Object.entries(PACKAGES).map(([key,p])=>(
<button key={key}
onClick={()=>setSelectedPackage(key)}
className={`block w-full p-3 mb-2 rounded-xl ${selectedPackage===key?'bg-blue-600':'bg-gray-800'}`}>
{p.label}
</button>
))}
</div>

<button disabled={!selectedDate}
onClick={()=>addDoc(collection(db,'orders'),{
room:profile.room,
clientName:profile.name,
date:selectedDate,
package:selectedPackage,
status:'Очікування',
adminComment:''
})}
className="w-full bg-blue-600 py-4 rounded-2xl font-bold disabled:bg-gray-700">
Підтвердити запис
</button>

</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

<style>
body{background:black;color:white;}
</style>
</head>
<body>
<div id="root"></div>
</body>
</html>
