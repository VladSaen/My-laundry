<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laundry Service</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const e = React.createElement;

        const getDeviceInfo = () => {
            const ua = navigator.userAgent;
            const res = `${window.screen.width}x${window.screen.height}`;
            let gpu = "Unknown";
            try {
                const gl = document.createElement('canvas').getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL).split(' ').pop();
            } catch(e) {}
            const os = ua.includes('iPhone') ? 'iOS' : ua.includes('Android') ? 'Android' : 'PC';
            return `${os} | ${res} | ${gpu}`;
        };

        function App() {
            const [user, setUser] = React.useState(() => JSON.parse(localStorage.getItem('l_u')));
            const [orders, setOrders] = React.useState([]);
            const [tab, setTab] = React.useState('active'); 
            const [selD, setSelD] = React.useState(new Date().toISOString().split('T')[0]);
            const [curM, setCurM] = React.useState(new Date());
            const [pkg, setPkg] = React.useState('medium');
            const [note, setNote] = React.useState('');

            const today = new Date().toISOString().split('T')[0];

            React.useEffect(() => {
                signInAnonymously(auth);
                return onSnapshot(collection(db, 'orders'), s => setOrders(s.docs.map(d => ({id:d.id, ...d.data()}))));
            }, []);

            const addOrder = async () => {
                if (orders.filter(o => o.d === selD && !o.archived).length >= 2) return alert('Цей день вже зайнятий!');
                try {
                    await addDoc(collection(db, 'orders'), {
                        n: user.n, r: user.r, d: selD, pkg, note,
                        archived: false, dev: getDeviceInfo(), 
                        createdAt: Date.now() 
                    });
                    alert('Запис створено!');
                } catch(err) { alert('Помилка бази'); }
            };

            const Calendar = (admin = false) => {
                const y = curM.getFullYear(), m = curM.getMonth();
                const offset = new Date(y, m, 1).getDay() || 7;
                const days = new Date(y, m + 1, 0).getDate();
                const grid = [];
                ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(d => grid.push(e('div',{key:d,className:'text-[8px] text-zinc-600 text-center font-bold mb-2 uppercase'},d)));
                for(let i=1; i<offset; i++) grid.push(e('div',{key:'o'+i}));
                for(let d=1; d<=days; d++) {
                    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const count = orders.filter(o => o.d === ds && !o.archived).length;
                    const isPast = ds < today;
                    grid.push(e('div', {
                        key: d,
                        onClick: () => (!isPast || admin) && setSelD(ds),
                        className: `aspect-square flex items-center justify-center rounded-xl text-xs font-black border transition-all 
                        ${selD===ds?'bg-blue-600 border-blue-400':'bg-zinc-900 border-white/5'} 
                        ${isPast?'opacity-10':count>=2?'text-red-500':''}`
                    }, d));
                }
                return e('div', {className:'bg-zinc-950 p-4 rounded-3xl border border-white/5 mb-6'},
                    e('div',{className:'flex justify-between items-center mb-4 px-2 font-black uppercase text-[10px]'},
                        e('button',{onClick:()=>setCurM(new Date(y,m-1))},'←'),
                        e('b',{className:'text-blue-500 tracking-widest'},curM.toLocaleString('uk-UA',{month:'long'})),
                        e('button',{onClick:()=>setCurM(new Date(y,m+1))},'→')
                    ),
                    e('div',{className:'grid grid-cols-7 gap-1'}, grid)
                );
            };

            if (!user) return e('div', {className:'p-10 bg-black min-h-screen text-white flex flex-col justify-center'},
                e('h1',{className:'text-3xl font-black mb-10 text-center tracking-tighter'},'LAUNDRY'),
                e('input',{id:'n', placeholder:'Ваше ім\'я', className:'p-5 mb-4 bg-zinc-900 rounded-3xl outline-none border border-white/5'}),
                e('input',{id:'r', type:'number', placeholder:'Номер кімнати', className:'p-5 mb-10 bg-zinc-900 rounded-3xl outline-none border border-white/5'}),
                e('button',{onClick:()=>{
                    const n=document.getElementById('n').value.trim(), r=document.getElementById('r').value.trim();
                    if(n){
                        const u={n, r, adm: n.toLowerCase()==='tokyo'};
                        localStorage.setItem('l_u',JSON.stringify(u));
                        setUser(u);
                    }
                }, className:'bg-blue-600 py-5 rounded-3xl font-black uppercase shadow-xl shadow-blue-900/20 active:scale-95 transition'},'Увійти')
            );

            if (user.adm) return e('div', {className:'p-4 bg-black min-h-screen text-white font-sans'},
                e('div',{className:'flex justify-between items-center mb-8 border-b border-white/5 pb-4'},
                    e('div',{className:'flex gap-6 text-[10px] font-black uppercase tracking-widest'},
                        ['active','stats'].map(t => e('button',{key:t, onClick:()=>setTab(t), className:tab===t?'text-blue-500':'text-zinc-600'}, t==='active'?'План':'Люди'))
                    ),
                    e('button',{onClick:()=>{localStorage.clear(); location.reload();}, className:'text-red-500 text-[10px] font-black'},'ВИХІД')
                ),
                tab === 'active' ? e(React.Fragment, null,
                    Calendar(true),
                    e('div',{className:'space-y-3'},
                        orders.filter(o => o.d === selD && !o.archived).map(o => 
                            e('div',{key:o.id, className:'bg-zinc-900 p-5 rounded-3xl border border-white/5 flex justify-between items-center'},
                                e('div',null,
                                    e('div',{className:'font-black uppercase text-sm tracking-tight'},`${o.n} (${o.r})`),
                                    e('div',{className:'text-[9px] text-zinc-500 font-bold uppercase mt-1'},`${o.pkg} • ${o.note || 'без коментаря'}`)
                                ),
                                e('div',{className:'flex gap-4'},
                                    e('button',{onClick:()=>updateDoc(doc(db,'orders',o.id),{archived:true})},'✅'),
                                    e('button',{onClick:()=>confirm('Видалити?') && deleteDoc(doc(db,'orders',o.id))},'🗑️')
                                )
                            )
                        )
                    )
                ) : e('div',{className:'space-y-4'},
                    Object.values(orders.reduce((acc,o)=>{
                        const k=`${o.n}_${o.r}`;
                        if(!acc[k]) acc[k]={n:o.n,r:o.r,c:0,d:o.dev};
                        acc[k].c++; return acc;
                    },{})).sort((a,b)=>b.c-a.c).map(u => 
                        e('div',{key:u.n+u.r, className:'bg-zinc-900 p-5 rounded-3xl flex justify-between border border-white/5 items-center'},
                            e('div',null, e('b',{className:'uppercase text-sm font-black'},u.n), e('p',{className:'text-[8px] text-zinc-500 mt-1'},u.d)),
                            e('div',{className:'bg-blue-600 px-3 py-1 rounded-full text-[10px] font-black'}, u.c)
                        )
                    )
                )
            );

            return e('div', {className:'p-8 bg-black min-h-screen text-white flex flex-col font-sans'},
                e('div',{className:'flex justify-between items-start mb-10'},
                    e('div',null,e('p',{className:'text-zinc-600 text-[10px] font-black uppercase mb-1'},'User:'),e('h2',{className:'text-xl font-black uppercase tracking-tighter'},user.n)),
                    e('button',{onClick:()=>{localStorage.clear(); location.reload();},className:'text-[8px] text-zinc-600 border border-white/10 px-4 py-2 rounded-full font-black uppercase'},'Вийти')
                ),
                Calendar(),
                e('div',{className:'mt-4 max-w-[300px] mx-auto w-full'},
                    e('div',{className:'flex gap-2 mb-4'},
                        ['small','medium','large'].map(v => e('button',{key:v, onClick:()=>setPkg(v), className:`flex-1 py-4 rounded-2xl border text-[9px] font-black uppercase transition-all ${pkg===v?'bg-blue-600 border-blue-400 shadow-lg shadow-blue-900/20':'bg-zinc-900 border-white/5 text-zinc-500'}`}, v==='small'?'До 3кг':v==='medium'?'3-5кг':'5+кг'))
                    ),
                    e('input',{value:note, onChange:e=>setNote(e.target.value), placeholder:'Додати коментар (напр. "кольорове")', className:'w-full p-4 bg-zinc-900 rounded-2xl border border-white/5 text-xs mb-8 outline-none focus:border-blue-500 transition-colors'}),
                    e('button',{onClick:addOrder, className:'w-full bg-blue-600 py-6 rounded-[2.5rem] font-black uppercase shadow-2xl shadow-blue-900/40 active:scale-95 transition-all'}, `Записатись на ${selD.split('-').reverse().join('.')}`)
                )
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
    <style>
        body { background: black; margin: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body><div id="root"></div></body>
</html>
