<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laundry Admin Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Визначаємо модель телефону
        const getDeviceModel = () => {
            const ua = navigator.userAgent;
            if (/iPhone/i.test(ua)) return "iPhone";
            if (/Android/i.test(ua)) {
                const match = ua.match(/Android\s([^\s;]+|.*?\s)(Build|[;)])/);
                return match ? "Android " + match[1].split(';')[0] : "Android";
            }
            return "PC/Other";
        };

        const PKG = { 
            small: { n: 'До 3 кг', d: 24 }, 
            medium: { n: '3 - 5 кг', d: 48 }, 
            large: { n: '5+ кг', d: 72 } 
        };
        const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];

        function App() {
            const [profile, setProfile] = React.useState(() => {
                const saved = localStorage.getItem('l_u');
                return saved ? JSON.parse(saved) : null;
            });
            const [bookings, setBookings] = React.useState([]);
            const [view, setView] = React.useState('active'); 
            const [admD, setAdmD] = React.useState(new Date().toISOString().split('T')[0]);
            const [curMonth, setCurMonth] = React.useState(new Date());

            React.useEffect(() => {
                signInAnonymously(auth);
                const unsub = onSnapshot(collection(db, 'orders'), s => {
                    setBookings(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, []);

            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const offset = firstDay === 0 ? 6 : firstDay - 1; 
                return { offset, daysInMonth, year, month };
            };

            const { offset, daysInMonth, year, month } = getDaysInMonth(curMonth);

            const getStats = () => {
                const users = {};
                bookings.forEach(b => {
                    const key = `${b.n?.toLowerCase().trim()}_${b.r}`;
                    if (!users[key]) users[key] = { n: b.n, r: b.r, device: b.dev || '?', orders: [] };
                    users[key].orders.push(b);
                });
                return Object.values(users).sort((a,b) => b.orders.length - a.orders.length);
            };

            // ЯКЩО НЕМАЄ ПРОФІЛЮ — ПОКАЗУЄМО ВХІД
            if (!profile) return (
                <div className="min-h-screen bg-black text-white flex flex-col justify-center p-8 font-sans">
                    <h1 className="text-2xl font-black text-blue-500 mb-8 text-center uppercase">Вхід</h1>
                    <input id="n_in" placeholder="Ваше ім'я" className="p-4 mb-4 bg-gray-900 rounded-2xl outline-none border border-white/5" />
                    <input id="r_in" type="number" placeholder="Кімната" className="p-4 mb-8 bg-gray-900 rounded-2xl outline-none border border-white/5" />
                    <button onClick={() => {
                        const n = document.getElementById('n_in').value.trim(), r = document.getElementById('r_in').value.trim();
                        if(n && r) {
                            const u = {n, r, adm: n.toLowerCase() === 'admin' && r === '777'};
                            localStorage.setItem('l_u', JSON.stringify(u));
                            setProfile(u);
                        }
                    }} className="bg-blue-600 py-4 rounded-2xl font-black uppercase">Увійти</button>
                </div>
            );

            // АДМІН-ПАНЕЛЬ
            if (profile.adm) return (
                <div className="p-4 bg-black min-h-screen text-white font-sans pb-20">
                    <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                        <div className="flex gap-4">
                            {['active', 'archive', 'stats'].map(v => (
                                <button key={v} onClick={() => setView(v)} className={`text-[10px] font-black uppercase tracking-widest ${view===v?'text-blue-500':'text-gray-500'}`}>
                                    {v === 'active' ? 'Календар' : v === 'archive' ? 'Архів' : 'Статистика'}
                                </button>
                            ))}
                        </div>
                        <button onClick={() => {localStorage.clear(); location.reload();}} className="text-[10px] text-red-500 font-black">ВИХІД</button>
                    </div>

                    {view !== 'stats' ? (
                        <>
                            <div className="bg-gray-900 rounded-3xl p-5 mb-6 border border-gray-800">
                                <div className="flex justify-between items-center mb-6 px-1">
                                    <button onClick={() => setCurMonth(new Date(year, month - 1))}>←</button>
                                    <b className="uppercase text-[10px] tracking-widest text-blue-400">{curMonth.toLocaleString('uk-UA', { month: 'long', year: 'numeric' })}</b>
                                    <button onClick={() => setCurMonth(new Date(year, month + 1))}>→</button>
                                </div>
                                <div className="grid grid-cols-7 gap-2 text-center">
                                    {WD.map(d => <div key={d} className="text-[8px] text-gray-600 font-black">{d}</div>)}
                                    {Array(offset).fill(0).map((_, i) => <div key={i}></div>)}
                                    {Array.from({length: daysInMonth}, (_, i) => {
                                        const d = i + 1;
                                        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                        const dayOrders = bookings.filter(b => b.d === dateStr && !b.archived);
                                        const isFull = dayOrders.length >= 2 || dayOrders.some(b => b.package === 'large');
                                        return (
                                            <div key={d} onClick={() => setAdmD(dateStr)}
                                                className={`aspect-square flex items-center justify-center rounded-xl text-xs font-black border transition-all
                                                ${admD === dateStr ? 'bg-blue-600 border-blue-400 scale-110' : isFull ? 'bg-red-900/20 border-red-900/50 text-red-500' : 'bg-black/30 border-white/5 text-gray-500'}`}>
                                                {d}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="space-y-3">
                                {bookings.filter(b => b.d === admD && (view === 'archive' ? b.archived : !b.archived)).map(b => (
                                    <div key={b.id} className="bg-gray-900 p-5 rounded-3xl border border-white/5">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <div className="font-black text-lg uppercase tracking-tighter">{b.n} (к. {b.r})</div>
                                                <div className="text-[9px] text-gray-500 mt-1 font-black">📱 {b.dev || 'Device Unknown'}</div>
                                            </div>
                                            <div className="flex gap-4">
                                                {!b.archived && <button onClick={() => updateDoc(doc(db,'orders',b.id), {archived:true})} className="text-xl">✅</button>}
                                                <button onClick={() => confirm('Видалити?') && deleteDoc(doc(db,'orders',b.id))} className="text-xl">🗑️</button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    ) : (
                        <div className="space-y-4">
                            {getStats().map(u => (
                                <div key={u.n+u.r} className="bg-gray-900 p-6 rounded-[2.5rem] border border-gray-800">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h4 className="text-xl font-black uppercase">{u.n}</h4>
                                            <p className="text-blue-500 text-[10px] font-black uppercase tracking-widest">Кімната {u.r}</p>
                                            <p className="text-gray-600 text-[9px] mt-2 italic font-bold">📱 {u.device}</p>
                                        </div>
                                        <div className="bg-blue-600/20 border border-blue-600/30 px-4 py-2 rounded-2xl text-[10px] font-black text-blue-400">{u.orders.length} ПРАНЬ</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );

            // КЛІЄНТСЬКА ПАНЕЛЬ
            return (
                <div className="p-8 bg-black min-h-screen text-white flex flex-col items-center justify-center font-sans">
                    <div className="w-20 h-20 bg-blue-600 rounded-[2.5rem] mb-8 flex items-center justify-center text-4xl shadow-2xl shadow-blue-900/50">🧺</div>
                    <h2 className="text-2xl font-black uppercase mb-2 tracking-tighter">Вітаємо, {profile.n}!</h2>
                    <p className="text-gray-500 text-sm mb-12 text-center max-w-[200px]">Виберіть дату, щоб записатися на прання</p>
                    
                    <button onClick={async () => {
                        const date = prompt("Дата (РРРР-ММ-ДД):", new Date().toISOString().split('T')[0]);
                        if(date) {
                            await addDoc(collection(db,'orders'), {
                                r: profile.r, n: profile.n, d: date, 
                                package: 'small', archived: false, 
                                dev: getDeviceModel(), 
                                createdAt: serverTimestamp()
                            });
                            alert("Запис створено!");
                        }
                    }} className="w-full max-w-xs bg-blue-600 py-5 rounded-[2.5rem] font-black uppercase shadow-xl">Забронювати</button>
                    
                    <button onClick={() => {localStorage.clear(); location.reload();}} className="mt-10 text-[10px] text-gray-700 font-black uppercase tracking-widest">Вийти</button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
    <style>
        body { background: black; margin: 0; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body><div id="root"></div></body>
</html>
