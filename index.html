<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запис на прання</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c",
            measurementId: "G-N33YNQTN3B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const ADMIN_PASSWORD = "Tokyo";
        const PACKAGES = {
            small: { label: 'Малий пакет', desc: 'До 5кг. Повернення ~24 год.' },
            medium: { label: 'Середній пакет', desc: '5-10кг. Повернення ~24-48 год.' },
            large: { label: 'Великий пакет', desc: '10кг+. Повернення ~48-72 год.' }
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('laundry_user')) || null);
            const [bookings, setBookings] = React.useState([]);
            const [selectedDate, setSelectedDate] = React.useState(null);
            const [selectedPackage, setSelectedPackage] = React.useState('small');
            const [isRegistering, setIsRegistering] = React.useState(!profile);
            
            // Поля форми
            const [regName, setRegName] = React.useState('');
            const [regRoom, setRegRoom] = React.useState('');

            React.useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                return onAuthStateChanged(auth, setUser);
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const q = collection(db, 'orders');
                return onSnapshot(q, (snapshot) => {
                    setBookings(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
            }, [user]);

            React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const isRoomValid = (room) => {
                const r = parseInt(room);
                return (r >= 90 && r <= 121) || (r >= 340 && r <= 344);
            };

            const handleSecretAdmin = () => {
                const pass = prompt("Введіть пароль:");
                if (pass === ADMIN_PASSWORD) {
                    const adminUser = { room: 'ADMIN', name: 'Адмін', isAdmin: true };
                    localStorage.setItem('laundry_user', JSON.stringify(adminUser));
                    setProfile(adminUser);
                    setIsRegistering(false);
                }
            };

            const getCalendarDays = () => {
                const days = [];
                const weekDays = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
                for(let i = 1; i <= 10; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    days.push({ 
                        date: d.toISOString().split('T')[0], 
                        day: d.getDate(), 
                        weekday: weekDays[d.getDay()],
                        month: d.toLocaleString('uk-UA', { month: 'long' })
                    });
                }
                return days;
            };

            if (isRegistering) {
                const showWarning = regRoom !== '' && !isRoomValid(regRoom);
                return React.createElement('div', { className: "min-h-screen bg-black text-white flex items-center justify-center p-6 font-sans relative" },
                    React.createElement('div', { onClick: handleSecretAdmin, className: "absolute top-0 right-0 w-20 h-20 z-50" }),
                    React.createElement('form', { 
                        onSubmit: (e) => {
                            e.preventDefault();
                            if(!isRoomValid(regRoom)) return;
                            const newUser = { room: regRoom, name: regName, isAdmin: false };
                            localStorage.setItem('laundry_user', JSON.stringify(newUser));
                            setProfile(newUser);
                            setIsRegistering(false);
                        },
                        className: "bg-gray-900 p-8 rounded-[2.5rem] w-full max-w-sm border border-gray-800 shadow-2xl"
                    },
                        React.createElement('h1', { className: "text-2xl font-black mb-6 text-blue-500 text-center uppercase tracking-tighter" }, "Запис на прання"),
                        React.createElement('input', { 
                            value: regName, onChange: (e) => setRegName(e.target.value),
                            required: true, placeholder: "Ваше ім'я", 
                            className: "w-full p-4 mb-4 bg-gray-800 rounded-2xl outline-none border border-transparent focus:border-blue-500 transition" 
                        }),
                        React.createElement('input', { 
                            type: "number", value: regRoom, onChange: (e) => setRegRoom(e.target.value),
                            required: true, placeholder: "Номер камери", 
                            className: "w-full p-4 mb-2 bg-gray-800 rounded-2xl outline-none border border-transparent focus:border-blue-500 transition" 
                        }),
                        showWarning && React.createElement('div', { className: "text-[11px] text-red-400 p-3 bg-red-900/20 rounded-xl mb-4 leading-tight" }, 
                            "Вибачте, але ця камера не може резервувати дні онлайн. Пишіть напряму в ", 
                            React.createElement('a', { href: "https://t.me/your_telegram", className: "underline font-bold" }, "Telegram")
                        ),
                        React.createElement('button', { 
                            disabled: showWarning || !regName || !regRoom,
                            className: "w-full bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 disabled:text-gray-600 py-4 rounded-2xl font-bold text-lg transition-all active:scale-95" 
                        }, "Увійти")
                    )
                );
            }

            if (profile?.isAdmin) {
                return React.createElement('div', { className: "min-h-screen bg-black text-white p-4 font-sans" },
                    React.createElement('div', { className: "flex justify-between items-center mb-6 bg-gray-900 p-4 rounded-2xl" },
                        React.createElement('h1', { className: "text-lg font-bold text-yellow-500" }, "Адмін-панель"),
                        React.createElement('button', { onClick: () => { localStorage.clear(); location.reload(); }, className: "text-xs font-bold text-red-500" }, "ВИЙТИ")
                    ),
                    bookings.length === 0 ? React.createElement('p', { className: "text-center text-gray-500 py-10" }, "Замовлень немає") :
                    bookings.sort((a,b) => a.date.localeCompare(b.date)).map(order => React.createElement('div', { key: order.id, className: "bg-gray-900 p-5 mb-3 rounded-3xl border border-gray-800 shadow-lg" },
                        React.createElement('div', { className: "flex justify-between items-start" },
                            React.createElement('div', null,
                                React.createElement('div', { className: "font-bold text-lg" }, `🏠 Камера ${order.room}`),
                                React.createElement('div', { className: "text-gray-400 text-sm" }, order.clientName),
                                React.createElement('div', { className: "mt-2 text-blue-400 font-bold" }, `${order.date} • ${PACKAGES[order.package]?.label}`)
                            ),
                            React.createElement('button', { onClick: () => { if(confirm('Видалити?')) deleteDoc(doc(db, 'orders', order.id)) }, className: "p-3 text-red-500" }, React.createElement('i', { 'data-lucide': "trash-2" }))
                        )
                    ))
                );
            }

            const myOrders = bookings.filter(b => b.room === profile.room && b.clientName === profile.name);
            const days = getCalendarDays();

            return React.createElement('div', { className: "min-h-screen bg-black text-white font-sans pb-10" },
                React.createElement('header', { className: "p-6 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-md z-40" },
                    React.createElement('div', null,
                        React.createElement('h1', { className: "text-xl font-black text-blue-500" }, profile.name),
                        React.createElement('p', { className: "text-xs text-gray-500" }, `Камера ${profile.room}`)
                    ),
                    React.createElement('button', { onClick: () => { localStorage.clear(); location.reload(); }, className: "p-3 bg-gray-900 rounded-2xl" }, React.createElement('i', { 'data-lucide': "log-out", className: "w-5 h-5" }))
                ),
                React.createElement('main', { className: "max-w-md mx-auto px-4 space-y-8" },
                    myOrders.length > 0 && React.createElement('section', null,
                        React.createElement('h2', { className: "text-[10px] font-bold uppercase text-gray-600 mb-4 tracking-widest px-2" }, "Ваші записи"),
                        myOrders.map(order => React.createElement('div', { key: order.id, className: "bg-gray-900 p-5 rounded-[2rem] border-l-4 border-blue-600 mb-3 shadow-xl" },
                            React.createElement('div', { className: "flex justify-between" },
                                React.createElement('span', { className: "font-bold" }, PACKAGES[order.package]?.label),
                                React.createElement('span', { className: "text-[9px] font-black bg-blue-600 px-2 py-1 rounded-full uppercase" }, order.status)
                            ),
                            React.createElement('div', { className: "text-xs text-gray-400 mt-1" }, order.date)
                        ))
                    ),
                    React.createElement('section', { className: "bg-gray-900 p-6 rounded-[2.5rem] border border-gray-800 shadow-2xl" },
                        React.createElement('h2', { className: "text-lg font-bold mb-6 text-center" }, "Оберіть день"),
                        React.createElement('div', { className: "space-y-3 mb-8" },
                            Object.entries(PACKAGES).map(([key, pkg]) => React.createElement('button', {
                                key: key, onClick: () => setSelectedPackage(key),
                                className: `p-4 rounded-3xl border-2 w-full text-left transition-all ${selectedPackage === key ? 'border-blue-600 bg-blue-600/10' : 'border-gray-800 bg-black/20'}`
                            }, 
                                React.createElement('div', { className: "font-bold text-sm" }, pkg.label),
                                React.createElement('div', { className: "text-[10px] text-gray-500" }, pkg.desc)
                            ))
                        ),
                        React.createElement('div', { className: "grid grid-cols-4 gap-3" },
                            days.map(d => {
                                const isBooked = bookings.some(b => b.date === d.date);
                                return React.createElement('button', {
                                    key: d.date, disabled: isBooked, onClick: () => setSelectedDate(d.date),
                                    className: `aspect-square rounded-2xl flex flex-col items-center justify-center transition-all ${
                                        selectedDate === d.date ? 'bg-blue-600 scale-105 shadow-lg' : 
                                        isBooked ? 'bg-red-900/20 text-red-700' : 'bg-gray-800'
                                    }`
                                }, 
                                    React.createElement('span', {className: "text-lg font-black"}, d.day),
                                    React.createElement('span', {className: "text-[9px] opacity-40 uppercase font-bold"}, d.weekday)
                                )
                            })
                        ),
                        React.createElement('button', { 
                            onClick: async () => {
                                await addDoc(collection(db, 'orders'), {
                                    room: profile.room, clientName: profile.name,
                                    date: selectedDate, package: selectedPackage,
                                    status: 'Прийнято', createdAt: serverTimestamp(), returnDateInfo: '24-48 год'
                                });
                                alert('Записано!');
                                setSelectedDate(null);
                            }, 
                            disabled: !selectedDate, 
                            className: "w-full bg-blue-600 py-5 rounded-3xl font-black text-lg shadow-xl mt-8 disabled:opacity-10" 
                        }, "ПІДТВЕРДИТИ")
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
    <style>
        body { background-color: black; color: white; -webkit-tap-highlight-color: transparent; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body><div id="root"></div></body>
</html>
