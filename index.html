<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запис на прання</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const PKG = { 
            small: { n: 'До 5 кг речей', d: 24 }, 
            medium: { n: '5 - 10 кг речей', d: 48 }, 
            large: { n: 'Більше 10 кг речей', d: 72 } 
        };
        const WD = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        function App() {
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('l_u')));
            const [bookings, setBookings] = React.useState([]);
            const [view, setView] = React.useState('active'); // 'active' або 'archive'
            const [selD, setSelD] = React.useState(null);
            const [selP, setSelP] = React.useState('small');
            const [admD, setAdmD] = React.useState(new Date().toISOString().split('T')[0]);
            const [now, setNow] = React.useState(Date.now());
            const [loading, setLoading] = React.useState(false);

            React.useEffect(() => {
                signInAnonymously(auth);
                const timer = setInterval(() => setNow(Date.now()), 30000);
                const unsub = onSnapshot(collection(db, 'orders'), s => {
                    setBookings(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => { clearInterval(timer); unsub(); };
            }, []);

            const isV = r => { 
                const n = parseInt(r); 
                return (n >= 90 && n <= 121) || (n >= 340 && n <= 344); 
            };
            
            const getT = (t) => {
                const diff = t - now;
                if (diff <= 0) return "ГОТОВО";
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                return `${h}г ${m}хв`;
            };

            const fD = d => d ? d.split('-').reverse().slice(0,2).join('.') : '??.??';
            const getM = d => new Date(d).toLocaleString('uk-UA', { month: 'long' });

            const checkLimit = (date, pkgType) => {
                const dayB = bookings.filter(b => (b.d === date || b.date === date) && !b.archived);
                if (dayB.length === 0) return false;
                if (dayB.some(b => b.package === 'large')) return true;
                if (pkgType === 'large' && dayB.length > 0) return true;
                return dayB.length >= 2;
            };

            if (!profile) return React.createElement('div', { className: "min-h-screen bg-black text-white flex flex-col justify-center p-8 font-sans relative" },
                React.createElement('div', { onClick: () => { const p = prompt('Password?'); if(p === 'Tokyo') { const a = {adm:true, n:'Адмін', r:'ADM'}; localStorage.setItem('l_u', JSON.stringify(a)); setProfile(a); } }, className: "absolute top-0 right-0 w-20 h-20 z-50" }),
                React.createElement('h1', { className: "text-2xl font-black text-blue-500 mb-8 text-center uppercase tracking-tighter" }, "Авторизація"),
                React.createElement('input', { id: "n", placeholder: "Ваше ім'я", className: "p-4 mb-4 bg-gray-900 rounded-2xl outline-none border border-gray-800" }),
                React.createElement('input', { id: "r", type: "number", placeholder: "Камера", className: "p-4 mb-6 bg-gray-900 rounded-2xl outline-none border border-gray-800" }),
                React.createElement('button', { 
                    onClick: () => {
                        const n = document.getElementById('n').value.trim(), r = document.getElementById('r').value;
                        if(n && isV(r)) { const u={n, r, adm:false}; localStorage.setItem('l_u', JSON.stringify(u)); setProfile(u); }
                        else alert('Доступ обмежено. Звертайтеся особисто в Telegram');
                    }, className: "bg-blue-600 py-4 rounded-2xl font-black uppercase" 
                }, "УВІЙТИ")
            );

            // АДМІНКА
            if (profile.adm) {
                const dayBookings = bookings.filter(b => {
                    const isArchived = b.archived || (b.finishAt && now > b.finishAt + 43200000); // Авто-архів через 12г після готовності
                    if (view === 'archive') return isArchived;
                    return !isArchived && (b.d === admD || b.date === admD);
                }).sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

                return React.createElement('div', { className: "p-4 bg-black min-h-screen text-white font-sans" },
                    React.createElement('div', { className: "flex justify-between mb-6 items-center" }, 
                        React.createElement('b', {className:"text-yellow-500 text-lg font-black uppercase tracking-tighter"}, view === 'active' ? "Адмін Панель" : "Архів Усіх Стірок"), 
                        React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"text-red-500 text-[10px] font-black uppercase font-bold"}, "Вихід")
                    ),
                    
                    // Вкладки Активні/Архів
                    React.createElement('div', {className:"flex bg-gray-900 p-1 rounded-2xl mb-6 shadow-inner"},
                        React.createElement('button', {onClick:()=>setView('active'), className:`flex-1 py-2 rounded-xl text-[10px] font-black uppercase transition ${view==='active'?'bg-blue-600 shadow-lg':'text-gray-500'}`}, "Активні"),
                        React.createElement('button', {onClick:()=>setView('archive'), className:`flex-1 py-2 rounded-xl text-[10px] font-black uppercase transition ${view==='archive'?'bg-blue-600 shadow-lg':'text-gray-500'}`}, "Архів")
                    ),

                    view === 'active' && React.createElement('div', { className: "flex gap-2 mb-8 overflow-x-auto pb-4 scrollbar-hide" }, Array.from({length:10}, (_,i)=>{
                        const d = new Date(); d.setDate(d.getDate()+i); const ds = d.toISOString().split('T')[0];
                        const count = bookings.filter(b => (b.d === ds || b.date === ds) && !b.archived).length;
                        const isFull = checkLimit(ds, 'small');
                        return React.createElement(React.Fragment, {key:ds},
                            React.createElement('button', {
                                onClick:()=>setAdmD(ds),
                                className:`min-w-[42px] aspect-square rounded-xl flex flex-col items-center justify-center border transition-all ${admD===ds?'bg-yellow-600 border-yellow-400':isFull?'bg-red-950/40 border-red-900/50':'bg-gray-900 border-gray-800'}`
                            }, 
                                React.createElement('span', {className:"text-[7px] font-bold uppercase"}, WD[d.getDay()]),
                                React.createElement('span', {className:"font-black text-sm"}, d.getDate()),
                                count > 0 && React.createElement('div', {className:"flex gap-0.5 mt-1"}, Array(count).fill(0).map((_,idx)=>React.createElement('div', {key:idx, className:"w-1 h-1 bg-blue-400 rounded-full"})))
                            )
                        );
                    })),

                    dayBookings.length === 0 ? React.createElement('p', {className:"text-center text-gray-600 py-10 text-xs uppercase font-black tracking-widest"}, "Тут пусто") :
                    dayBookings.map((b, index) => {
                        const mTime = new Date((b.d || b.date).split('-')[0], (b.d || b.date).split('-')[1]-1, (b.d || b.date).split('-')[2], 6, 0, 0).getTime();
                        return React.createElement('div', { key: b.id, className: "bg-gray-900 p-5 mb-4 rounded-3xl border border-gray-800" },
                            React.createElement('div', { className: "flex justify-between items-start mb-4" },
                                React.createElement('div', null, React.createElement('div', {className:"font-black text-xl leading-none"}, `${b.r} — ${b.n}`), React.createElement('div', {className:"text-blue-400 text-[10px] font-black uppercase mt-1"}, PKG[b.package]?.n + (b.archived ? " (Архів)" : ""))),
                                view === 'active' && React.createElement('button', {onClick:()=>confirm('Перенести в архів?') && updateDoc(doc(db,'orders',b.id), {archived: true}), className:"text-gray-700 p-1"}, "📥")
                            ),
                            view === 'active' && React.createElement('div', {className:"relative mb-4"},
                                React.createElement('textarea', {
                                    id: `note-${b.id}`, placeholder: "Коментар...", defaultValue: b.note || "",
                                    className: "w-full bg-black/40 border border-white/5 rounded-xl p-3 text-xs outline-none focus:border-blue-500/30 min-h-[60px]"
                                }),
                                React.createElement('button', {
                                    onClick: (e) => {
                                        const val = document.getElementById(`note-${b.id}`).value;
                                        updateDoc(doc(db,'orders',b.id), {note: val});
                                        e.target.innerText = "OK"; setTimeout(()=>e.target.innerText="Зберегти", 2000);
                                    }, className: "absolute bottom-2 right-2 bg-blue-600 text-[8px] font-black uppercase px-2 py-1 rounded-lg"
                                }, "Зберегти")
                            ),
                            !b.finishAt ? React.createElement('button', {
                                onClick: () => updateDoc(doc(db,'orders',b.id), {status:'Підтверджено', finishAt: Date.now() + ((PKG[b.package].d + (index > 0 ? 24 : 0)) * 3600000)}),
                                className:"w-full bg-blue-600 py-3 rounded-2xl text-[10px] font-black uppercase"
                            }, "Підтвердити") : React.createElement('div', {className:"flex justify-between items-center bg-black/20 p-3 rounded-xl border border-white/5"},
                                React.createElement('span', {className:"text-green-500 font-black text-[10px] uppercase font-sans font-bold"}, (b.archived || now > b.finishAt) ? "ЗАВЕРШЕНО" : (now > mTime ? `В роботі: ${getT(b.finishAt)}` : `До забору: ${getT(mTime)}`)),
                                view === 'active' && React.createElement('button', {onClick: () => { const h = prompt("Годин від зараз?"); if(h) updateDoc(doc(db,'orders',b.id), {finishAt: Date.now() + (parseInt(h) * 3600000)}); }, className:"text-gray-500"}, "✏️")
                            )
                        );
                    })
                );
            }

            // ЮЗЕР ПАНЕЛЬ
            const my = bookings.filter(b => b.r === profile.r && b.n.toLowerCase() === profile.n.toLowerCase() && (view === 'archive' ? b.archived : !b.archived))
                             .sort((a,b) => (b.d || b.date).localeCompare(a.d || a.date));

            return React.createElement('div', { className: "min-h-screen bg-black text-white pb-10 font-sans" },
                React.createElement('header', { className: "p-6 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-md z-50 border-b border-white/5" },
                    React.createElement('div', null, React.createElement('b', {className:"text-blue-500 text-xl font-black uppercase leading-none"}, profile.n), React.createElement('p', {className:"text-[10px] text-gray-500 uppercase font-bold mt-1 tracking-wider"}, `Камера ${profile.r}`)),
                    React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"text-[10px] font-black uppercase text-gray-600"}, "Вихід")
                ),
                
                React.createElement('main', { className: "p-4 space-y-6 max-w-2xl mx-auto" },
                    // Вкладки для Юзера
                    React.createElement('div', {className:"flex bg-gray-900 p-1 rounded-3xl shadow-inner"},
                        React.createElement('button', {onClick:()=>setView('active'), className:`flex-1 py-3 rounded-2xl text-[10px] font-black uppercase transition ${view==='active'?'bg-blue-600 text-white':'text-gray-600'}`}, "Поточні стірки"),
                        React.createElement('button', {onClick:()=>setView('archive'), className:`flex-1 py-3 rounded-2xl text-[10px] font-black uppercase transition ${view==='archive'?'bg-blue-600 text-white':'text-gray-600'}`}, "Історія (Архів)")
                    ),

                    view === 'active' && my.length === 0 && React.createElement('p', {className:"text-center text-gray-700 py-4 text-[10px] font-black uppercase tracking-widest"}, "У вас немає активних записів"),

                    my.map((o) => {
                        const mTime = new Date((o.d || o.date).split('-')[0], (o.d || o.date).split('-')[1]-1, (o.d || o.date).split('-')[2], 6, 0, 0).getTime();
                        return React.createElement('div', { key: o.id, className: "w-full bg-gray-900 rounded-[2.5rem] border border-gray-800 overflow-hidden" },
                            React.createElement('div', { className: `p-2 text-[10px] font-black text-center ${o.archived ? 'bg-gray-800 text-gray-500' : o.finishAt ? 'bg-blue-600/20 text-blue-400' : 'bg-orange-600/20 text-orange-500'}` },
                                o.archived ? '📁 ЗАВЕРШЕНО ТА В АРХІВІ' : (!o.finishAt ? '⌛ ОЧІКУВАННЯ ПІДТВЕРДЖЕННЯ' : (now > mTime ? '✅ РЕЧІ БУДЕ ПОВЕРНУТО' : '👕 ВИСТАВТЕ ПРАННЯ ПО МУСОРУ'))
                            ),
                            React.createElement('div', {className:"p-6"},
                                React.createElement('div', {className:"flex justify-between items-start mb-4"},
                                    React.createElement('div', null, React.createElement('p', {className:"font-black text-xl leading-none"}, PKG[o.package]?.n), React.createElement('p', {className:"text-xs text-gray-500 mt-2 font-bold uppercase"}, fD(o.d || o.date))),
                                    React.createElement('div', {className:"text-right"}, 
                                        React.createElement('p', {className:"text-[9px] text-gray-500 uppercase font-black mb-1"}, o.archived ? "Було готово" : (o.finishAt ? (now > mTime ? "Буде готово" : "До 06:00 ранку") : "Очікування")),
                                        React.createElement('p', {className: `${o.finishAt && !o.archived ? 'text-blue-400' : 'text-gray-700'} font-black text-2xl tracking-tighter`}, o.archived ? "ГОТОВО" : (o.finishAt ? (now > mTime ? getT(o.finishAt) : getT(mTime)) : `~${PKG[o.package]?.d}г.`))
                                    )
                                ),
                                o.note && React.createElement('div', {className:"bg-blue-600/5 p-4 rounded-2xl border border-blue-600/20 text-xs text-blue-300 italic mb-4"}, o.note),
                                !o.finishAt && !o.archived && React.createElement('button', {onClick:()=>confirm('Скасувати запис?') && deleteDoc(doc(db,'orders',o.id)), className:"text-[9px] text-red-900 uppercase font-black tracking-widest"}, "Скасувати замовлення")
                            )
                        );
                    }),

                    view === 'active' && React.createElement('div', { className: "bg-gray-900 p-6 rounded-[3rem] border border-gray-800" },
                        React.createElement('div', { className: "flex gap-2 mb-8 overflow-x-auto pb-4 scrollbar-hide" }, Array.from({length:10}, (_,i)=>{
                            const d = new Date(); d.setDate(d.getDate()+i+1); const ds = d.toISOString().split('T')[0];
                            const isFull = checkLimit(ds, selP);
                            return React.createElement('button', {
                                key:ds, disabled:isFull, onClick:()=>setSelD(ds),
                                className:`min-w-[52px] aspect-square rounded-2xl flex flex-col items-center justify-center transition-all ${selD===ds?'bg-blue-600':isFull?'bg-red-950 border border-red-900/50 opacity-40 cursor-not-allowed':'bg-black/40 border border-white/5'}`
                            }, React.createElement('span', {className:"text-[9px] opacity-40 font-black mb-1 uppercase"}, WD[d.getDay()]), React.createElement('span', {className:"font-black text-lg"}, d.getDate()));
                        })),
                        Object.entries(PKG).map(([k, p]) => React.createElement('button', {
                            key: k, onClick: () => { setSelP(k); setSelD(null); },
                            className: `p-5 rounded-[2.5rem] border-2 w-full text-left mb-3 flex justify-between items-center ${selP === k ? 'border-blue-600 bg-blue-600/5' : 'border-transparent bg-black/20 opacity-40'}`
                        }, React.createElement('p', {className:"font-black text-sm uppercase"}, p.n), React.createElement('p', {className:"text-[10px] font-black text-gray-500 uppercase"}, `~ ${p.d} год.`))),
                        React.createElement('button', { 
                            onClick: async () => {
                                if (loading) return; setLoading(true);
                                await addDoc(collection(db,'orders'), {r:profile.r, n:profile.n, d:selD, package:selP, archived:false, createdAt:serverTimestamp()});
                                setSelD(null); setLoading(false); window.scrollTo({top:0, behavior:'smooth'});
                            },
                            disabled: !selD || loading, className: "w-full bg-blue-600 py-5 rounded-[2.5rem] font-black text-lg mt-5 disabled:opacity-20 uppercase"
                        }, loading ? "ЗАПИС..." : "ЗАПИСАТИСЯ")
                    )
                )
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
    <style> body { background: black; -webkit-tap-highlight-color: transparent; } .scrollbar-hide::-webkit-scrollbar { display: none; } </style>
</head>
<body><div id="root"></div></body>
</html>
