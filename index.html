<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Запис на прання</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

/* === ТВОЯ ОРИГІНАЛЬНА CONFIG — НЕ ЗМІНЕНА === */
const firebaseConfig = {
apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
authDomain: "my-laundry-84f8b.firebaseapp.com",
projectId: "my-laundry-84f8b",
storageBucket: "my-laundry-84f8b.firebasestorage.app",
messagingSenderId: "524025568005",
appId: "1:524025568005:web:65f72b000e8db75938f56c",
measurementId: "G-N33YNQTN3B"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_PASSWORD = "Tokyo";

const PACKAGES = {
small: { label: 'Малий пакет' },
medium: { label: 'Середній пакет' },
large: { label: 'Великий пакет' }
};

function App() {

const [user, setUser] = React.useState(null);
const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('laundry_user')) || null);
const [bookings, setBookings] = React.useState([]);
const [selectedDate, setSelectedDate] = React.useState(null);
const [selectedPackage, setSelectedPackage] = React.useState('small');
const [isRegistering, setIsRegistering] = React.useState(!profile);

const [regName, setRegName] = React.useState('');
const [regRoom, setRegRoom] = React.useState('');

React.useEffect(() => {
signInAnonymously(auth).catch(console.error);
return onAuthStateChanged(auth, setUser);
}, []);

React.useEffect(() => {
if (!user) return;
return onSnapshot(collection(db, 'orders'), snapshot => {
setBookings(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
});
}, [user]);

React.useEffect(() => {
if (window.lucide) window.lucide.createIcons();
});

const isRoomValid = (room) => {
const r = parseInt(room);
return (r >= 90 && r <= 121) || (r >= 340 && r <= 344);
};

const getCalendarDays = () => {
const days = [];
for (let i = 1; i <= 10; i++) {
const d = new Date();
d.setDate(d.getDate() + i);
days.push({
date: d.toISOString().split('T')[0],
day: d.getDate()
});
}
return days;
};

/* ================== РЕЄСТРАЦІЯ ================== */
if (isRegistering) {

const showWarning = regRoom !== '' && !isRoomValid(regRoom);

return React.createElement('div',
{ className: "min-h-screen bg-black text-white flex items-center justify-center p-6 relative" },

React.createElement('div',
{
onClick: () => {
const pass = prompt("Введіть пароль:");
if (pass === ADMIN_PASSWORD) {
const adminUser = { room: 'ADMIN', name: 'Адмін', isAdmin: true };
localStorage.setItem('laundry_user', JSON.stringify(adminUser));
setProfile(adminUser);
setIsRegistering(false);
}
},
className: "absolute top-0 right-0 w-20 h-20 z-50"
}
),

React.createElement('form',
{
onSubmit: (e) => {
e.preventDefault();
if (!isRoomValid(regRoom)) return;
const newUser = { room: regRoom, name: regName, isAdmin: false };
localStorage.setItem('laundry_user', JSON.stringify(newUser));
setProfile(newUser);
setIsRegistering(false);
},
className: "bg-gray-900 p-8 rounded-3xl w-full max-w-sm"
},

React.createElement('h1',
{ className: "text-2xl font-bold mb-6 text-blue-500 text-center" },
"Запис на прання"
),

React.createElement('input',
{
value: regName,
onChange: (e) => setRegName(e.target.value),
required: true,
placeholder: "Ваше ім'я",
className: "w-full p-4 mb-4 bg-gray-800 rounded-2xl"
}
),

React.createElement('input',
{
type: "number",
value: regRoom,
onChange: (e) => setRegRoom(e.target.value),
required: true,
placeholder: "Номер камери",
className: "w-full p-4 mb-2 bg-gray-800 rounded-2xl"
}
),

showWarning && React.createElement('div',
{ className: "text-xs text-red-400 mb-4" },
"Ця камера не може резервувати дні онлайн."
),

React.createElement('button',
{
disabled: showWarning || !regName || !regRoom,
className: "w-full bg-blue-600 disabled:bg-gray-700 py-4 rounded-2xl font-bold"
},
"Увійти"
)
)
);
}

/* ================== АДМІН ================== */
if (profile?.isAdmin) {

const days = getCalendarDays();

return React.createElement('div',
{ className: "min-h-screen bg-black text-white p-6" },

React.createElement('div',
{ className: "flex justify-between mb-6" },

React.createElement('h1',
{ className: "text-yellow-500 font-bold" },
"Адмін-панель"
),

React.createElement('button',
{
onClick: () => { localStorage.clear(); location.reload(); },
className: "text-red-500"
},
"ВИЙТИ"
)
),

React.createElement('div',
{ className: "grid grid-cols-5 gap-4" },

days.map(day => {

const dayOrders = bookings.filter(b => b.date === day.date);

return React.createElement('div',
{ key: day.date, className: "bg-gray-900 p-4 rounded-2xl" },

React.createElement('div',
{ className: "font-bold mb-2" },
day.day
),

dayOrders.map(order =>
React.createElement('div',
{ key: order.id, className: "text-xs mb-2 p-2 bg-gray-800 rounded-xl" },

React.createElement('div', null, "Камера " + order.room),

React.createElement('div',
{ className: "flex gap-2 mt-1" },

React.createElement('button',
{
onClick: () => updateDoc(doc(db, 'orders', order.id), {
status: 'Підтверджено'
}),
className: "text-green-400"
},
"✔"
),

React.createElement('button',
{
onClick: () => updateDoc(doc(db, 'orders', order.id), {
status: 'Відхилено'
}),
className: "text-red-400"
},
"✖"
)
)
)
)
);
})
)
);
}

/* ================== КОРИСТУВАЧ ================== */

const myOrders = bookings.filter(b => b.room === profile.room);
const days = getCalendarDays();

return React.createElement('div',
{ className: "min-h-screen bg-black text-white p-6" },

React.createElement('div',
{ className: "flex justify-between mb-6" },

React.createElement('div', null,
React.createElement('h1',
{ className: "text-blue-500 font-bold" },
profile.name
),
React.createElement('div',
{ className: "text-xs text-gray-500" },
"Камера " + profile.room
)
),

React.createElement('button',
{
onClick: () => { localStorage.clear(); location.reload(); },
className: "text-red-500"
},
"Вийти"
)
),

React.createElement('div',
{ className: "grid grid-cols-5 gap-4 mb-8" },

days.map(day => {

const order = myOrders.find(o => o.date === day.date);

return React.createElement('div',
{ key: day.date, className: "bg-gray-900 p-4 rounded-2xl text-center" },

React.createElement('div',
{ className: "font-bold" },
day.day
),

order && React.createElement('div',
{ className: "mt-2 text-xs" },

order.status === 'Підтверджено'
? React.createElement('span', { className: "text-green-400" }, "Підтверджено ✔")
: order.status === 'Відхилено'
? React.createElement('span', { className: "text-red-400" }, "Відхилено ✖")
: React.createElement('span', { className: "text-yellow-400" }, "Очікування підтвердження"),

React.createElement('div',
{ className: "text-gray-400 mt-1 text-[10px]" },
order.adminComment || "Виставляйте стірку по мусору"
)
)
);
})
),

React.createElement('h2',
{ className: "mb-4 font-bold" },
"Оберіть дату"
),

React.createElement('div',
{ className: "grid grid-cols-5 gap-3 mb-6" },

days.map(d =>
React.createElement('button',
{
key: d.date,
onClick: () => setSelectedDate(d.date),
className: "p-4 rounded-xl " + (selectedDate === d.date ? "bg-blue-600" : "bg-gray-800")
},
d.day
)
)
),

React.createElement('div',
{ className: "mb-6" },

Object.entries(PACKAGES).map(([key, p]) =>
React.createElement('button',
{
key: key,
onClick: () => setSelectedPackage(key),
className: "block w-full p-3 mb-2 rounded-xl " + (selectedPackage === key ? "bg-blue-600" : "bg-gray-800")
},
p.label
)
)
),

React.createElement('button',
{
disabled: !selectedDate,
onClick: () => addDoc(collection(db, 'orders'), {
room: profile.room,
clientName: profile.name,
date: selectedDate,
package: selectedPackage,
status: 'Очікування',
adminComment: ''
}),
className: "w-full bg-blue-600 py-4 rounded-2xl font-bold disabled:bg-gray-700"
},
"Підтвердити запис"
)
);
}

ReactDOM.createRoot(document.getElementById('root'))
.render(React.createElement(App));

</script>

<style>
body { background:black; color:white; }
</style>
</head>
<body>
<div id="root"></div>
</body>
</html>
