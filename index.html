<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запис на прання</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const PKG = { 
            small: { n: 'До 3 кг речей', d: 24 }, 
            medium: { n: '3 - 5 кг речей', d: 48 }, 
            large: { n: '5+ кг (Великий пакет)', d: 72 } 
        };
        const WD = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        const getLocD = (date = new Date()) => {
            const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, '0'), d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        function App() {
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('l_u')));
            const [bookings, setBookings] = React.useState([]);
            const [view, setView] = React.useState('active');
            const [selD, setSelD] = React.useState(null);
            const [selP, setSelP] = React.useState('small');
            const [admD, setAdmD] = React.useState(getLocD());
            const [off, setOff] = React.useState(0);
            const [now, setNow] = React.useState(Date.now());
            const [loading, setLoading] = React.useState(false);

            React.useEffect(() => {
                signInAnonymously(auth);
                const timer = setInterval(() => setNow(Date.now()), 10000);
                const unsub = onSnapshot(collection(db, 'orders'), s => {
                    setBookings(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => { clearInterval(timer); unsub(); };
            }, []);

            // ЛОГІКА АВТО-АРХІВАЦІЇ (Тільки для адміна)
            React.useEffect(() => {
                if (profile?.adm && bookings.length > 0) {
                    bookings.forEach(b => {
                        if (b.confirmed && !b.archived) {
                            const pickupTime = new Date(b.d + "T06:00:00").getTime();
                            const finishTime = pickupTime + (PKG[b.package].d * 3600000);
                            if (Date.now() > (finishTime + 43200000)) { // +12 годин
                                updateDoc(doc(db, 'orders', b.id), { archived: true });
                            }
                        }
                    });
                }
            }, [bookings, profile?.adm]);

            const isV = r => { const n = parseInt(r); return (n >= 90 && n <= 121) || (n >= 340 && n <= 344); };
            
            const getOrderTimers = (o) => {
                if (!o.confirmed) return { label: "ОЧІКУЄ ПІДТВЕРДЖЕННЯ", time: "WAIT...", color: "text-red-500", bg: "bg-red-900/20" };
                const pickupTime = new Date(o.d + "T06:00:00").getTime();
                if (now < pickupTime) return { label: "ЗАБЕРУ О 06:00", time: formatDiff(pickupTime - now), color: "text-yellow-500", bg: "bg-yellow-900/20" };
                const finishTime = pickupTime + (PKG[o.package].d * 3600000);
                const diff = finishTime - now;
                return diff <= 0 ? { label: "ГОТОВО", time: "ОК", color: "text-green-500", bg: "bg-green-900/20" } : { label: "ПРАННЯ", time: formatDiff(diff), color: "text-blue-400", bg: "bg-blue-600/20" };
            };

            const formatDiff = (d) => `${Math.floor(d / 3600000)}г ${Math.floor((d % 3600000) / 60000)}хв`;
            const fD = d => d ? d.split('-').reverse().slice(0,2).join('.') : '??.??';

            if (!profile) return React.createElement('div', { className: "min-h-screen bg-black text-white flex flex-col justify-center p-8 font-sans" },
                React.createElement('div', { onClick: () => { const p = prompt('Pass?'); if(p === 'Tokyo') { const a = {adm:true, n:'Адмін', r:'ADM'}; localStorage.setItem('l_u', JSON.stringify(a)); setProfile(a); } }, className: "absolute top-0 right-0 w-20 h-20 opacity-0" }),
                React.createElement('h1', { className: "text-2xl font-black text-blue-500 mb-8 text-center uppercase" }, "LAUNDRY"),
                React.createElement('input', { id: "n", placeholder: "Ваше ім'я", className: "p-4 mb-4 bg-gray-900 rounded-2xl outline-none" }),
                React.createElement('input', { id: "r", type: "number", placeholder: "Кімната", className: "p-4 mb-6 bg-gray-900 rounded-2xl outline-none" }),
                React.createElement('button', { onClick: () => { const n = document.getElementById('n').value.trim(), r = document.getElementById('r').value; if(n && isV(r)) { const u={n, r, adm:false}; localStorage.setItem('l_u', JSON.stringify(u)); setProfile(u); } else alert('Помилка'); }, className: "bg-blue-600 py-4 rounded-2xl font-black uppercase" }, "УВІЙТИ")
            );

            if (profile.adm) {
                const filtered = bookings.filter(b => b.d === admD && (view === 'archive' ? b.archived : !b.archived));
                const bDate = new Date(); bDate.setMonth(bDate.getMonth() + off);
                const mLabel = bDate.toLocaleString('uk-UA', { month: 'long' });
                const days = Array.from({length: new Date(bDate.getFullYear(), bDate.getMonth() + 1, 0).getDate()}, (_, i) => getLocD(new Date(bDate.getFullYear(), bDate.getMonth(), i + 1)));

                return React.createElement('div', { className: "p-4 bg-black min-h-screen text-white font-sans" },
                    React.createElement('div', { className: "flex justify-between mb-4 border-b border-white/5 pb-4" }, 
                        React.createElement('div', null,
                            React.createElement('b', {className:"text-yellow-500 text-lg uppercase"}, view === 'active' ? "Адмін" : "Архів"),
                            React.createElement('button', {onClick:()=>setView(view==='active'?'archive':'active'), className:"text-[9px] text-blue-500 font-black uppercase block mt-1"}, view==='active'?'Перейти в Архів':'Перейти в Активні')
                        ),
                        React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"text-red-500 text-[10px] font-black uppercase"}, "Вихід")
                    ),
                    React.createElement('div', { className: "bg-gray-900 p-4 rounded-3xl border border-gray-800 mb-6" },
                        React.createElement('div', {className:"flex justify-between items-center mb-4 px-2"},
                            React.createElement('button', {onClick:()=>setOff(off-1), className:"text-blue-500 font-black px-4"}, "‹"),
                            React.createElement('p', {className:"text-[10px] font-black uppercase text-blue-500"}, mLabel),
                            React.createElement('button', {onClick:()=>setOff(off+1), className:"text-blue-500 font-black px-4"}, "›")
                        ),
                        React.createElement('div', { className: "grid grid-cols-7 gap-1" }, days.map(ds => React.createElement('button', {
                            key: ds, onClick:()=>setAdmD(ds),
                            className:`aspect-square rounded-lg flex items-center justify-center border text-[10px] font-black ${admD===ds ? 'bg-yellow-600 border-yellow-400' : bookings.some(b => b.d === ds && (view === 'archive' ? b.archived : !b.archived)) ? 'bg-blue-900/40 border-blue-500/50' : 'bg-black border-white/5 text-gray-600'}`
                        }, new Date(ds).getDate())))
                    ),
                    filtered.map(b => React.createElement('div', { key: b.id, className: "bg-gray-900/50 p-5 mb-3 rounded-2xl border border-gray-800" },
                        React.createElement('div', { className: "flex justify-between" },
                            React.createElement('div', null, React.createElement('div', {className:"font-black text-xl uppercase"}, `${b.r} — ${b.n}`), React.createElement('div', {className:"text-blue-400 text-[10px] uppercase font-bold"}, PKG[b.package]?.n)),
                            React.createElement('div', {className:"flex gap-4"},
                                React.createElement('button', {onClick:()=>confirm('Видалити?') && deleteDoc(doc(db,'orders',b.id))}, "🗑️"),
                                !b.archived && React.createElement('button', {onClick:()=>confirm('В архів?') && updateDoc(doc(db,'orders',b.id), {archived: true})}, "📥")
                            )
                        ),
                        !b.confirmed && !b.archived && React.createElement('button', { onClick: () => updateDoc(doc(db,'orders',b.id), {confirmed: true}), className:"w-full bg-blue-600 py-4 rounded-xl text-[10px] font-black uppercase mt-4" }, "Підтвердити")
                    ))
                );
            }

            // КЛІЄНТСЬКА ЧАСТИНА
            const nextDay = new Date(); nextDay.setDate(nextDay.getDate() + 1);
            const mLabelClient = nextDay.toLocaleString('uk-UA', { month: 'long' });
            const myOrders = bookings.filter(b => b.r === profile.r && b.n.toLowerCase() === profile.n.toLowerCase());
            const myFiltered = (view === 'active' ? myOrders.filter(o => !o.archived) : myOrders.filter(o => o.archived)).sort((a,b) => b.d.localeCompare(a.d));

            return React.createElement('div', { className: "min-h-screen bg-black text-white pb-10 font-sans" },
                React.createElement('header', { className: "p-6 flex justify-between items-center border-b border-white/5" },
                    React.createElement('div', null,
                        React.createElement('b', {className:"text-blue-500 text-xl font-black uppercase"}, profile.n),
                        React.createElement('div', {className:"flex gap-4 mt-2 font-bold"},
                            React.createElement('button', {onClick:()=>setView('active'), className:`text-[10px] font-black uppercase ${view==='active'?'text-white':'text-gray-600'}`}, "Активні"),
                            React.createElement('button', {onClick:()=>setView('archive'), className:`text-[10px] font-black uppercase ${view==='archive'?'text-white':'text-gray-600'}`}, "Архів")
                        )
                    ),
                    React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"text-[10px] font-black uppercase text-gray-600"}, "Вихід")
                ),
                React.createElement('main', { className: "p-4 space-y-6 max-w-2xl mx-auto" },
                    myFiltered.map(o => {
                        const t = getOrderTimers(o);
                        return React.createElement('div', { key: o.id, className: "bg-gray-900 rounded-[2.5rem] border border-gray-800 overflow-hidden" },
                            React.createElement('div', { className: `p-2 text-[10px] font-black text-center uppercase ${o.archived ? 'bg-gray-800 text-gray-500' : t.bg + ' ' + t.color}` }, o.archived ? '📁 АРХІВ' : t.label),
                            React.createElement('div', {className:"p-6 flex justify-between items-center"},
                                React.createElement('div', null, React.createElement('p', {className:"font-black text-xl uppercase"}, PKG[o.package]?.n), React.createElement('p', {className:"text-xs text-gray-500 mt-2 font-bold"}, fD(o.d))),
                                React.createElement('div', {className:"text-right"}, React.createElement('p', {className:"text-[9px] text-gray-500 uppercase font-black"}, "ЧАС:"), React.createElement('p', {className: `${t.color} font-black text-2xl`}, o.archived ? "OK" : t.time))
                            )
                        );
                    }),
                    view === 'active' && React.createElement('div', { className: "bg-gray-900 p-5 rounded-[2.5rem] border border-gray-800" },
                        React.createElement('p', {className:"text-[10px] font-black text-blue-500 uppercase mb-4 text-center tracking-tighter"}, mLabelClient),
                        React.createElement('div', { className: "grid grid-cols-7 gap-1 mb-2 text-center" }, WD.map(d => React.createElement('span', { key: d, className: "text-[8px] font-black text-gray-600 uppercase" }, d))),
                        React.createElement('div', { className: "grid grid-cols-7 gap-2" }, Array.from({length: 14}, (_, i) => {
                            const d = new Date(); d.setDate(d.getDate() + i + 1);
                            const ds = getLocD(d);
                            const isSelected = selD === ds;
                            return React.createElement('button', {
                                key: ds, onClick: () => setSelD(ds),
                                className: `aspect-square rounded-xl flex items-center justify-center border font-bold ${isSelected ? 'bg-blue-600 border-blue-400' : 'bg-black border-white/5 text-gray-400'}`
                            }, d.getDate());
                        })),
                        React.createElement('div', { className: "mt-6 space-y-2" }, 
                            Object.entries(PKG).map(([k, p]) => React.createElement('button', {
                                key: k, onClick: () => { setSelP(k); setSelD(null); },
                                className: `p-4 rounded-2xl border w-full flex justify-between items-center font-bold ${selP === k ? 'border-blue-600 bg-blue-600/10' : 'border-white/5 opacity-40'}`
                            }, React.createElement('span', { className: "font-black text-[11px] uppercase" }, p.n), React.createElement('span', { className: "text-[9px] text-gray-500" }, `${p.d}г.`)))
                        ),
                        React.createElement('button', { 
                            onClick: async () => { if(loading) return; setLoading(true); await addDoc(collection(db,'orders'), {r:profile.r, n:profile.n, d:selD, package:selP, archived:false, confirmed:false, createdAt:serverTimestamp()}); setSelD(null); setLoading(false); },
                            disabled: !selD || loading, className: "w-full bg-blue-600 py-5 rounded-3xl font-black text-md mt-4 disabled:opacity-20 uppercase"
                        }, loading ? "ЗАПИС..." : "ЗАПИСАТИСЯ")
                    )
                )
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
    <style> body { background: black; -webkit-tap-highlight-color: transparent; } </style>
</head>
<body><div id="root"></div></body>
</html>
