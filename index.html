<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запис на прання</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Оновлені пакети
        const PKG = { 
            small: { n: 'До 3 кг речей', d: 24 }, 
            medium: { n: '3 - 5 кг речей', d: 48 }, 
            large: { n: 'Більше 5 кг речей', d: 72 } 
        };
        const WD = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        const getLocD = (date = new Date()) => {
            const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, '0'), d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        function App() {
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('l_u')));
            const [bookings, setBookings] = React.useState([]);
            const [view, setView] = React.useState('active');
            const [selD, setSelD] = React.useState(null);
            const [selP, setSelP] = React.useState('small');
            const [admD, setAdmD] = React.useState(getLocD());
            const [now, setNow] = React.useState(Date.now());
            const [loading, setLoading] = React.useState(false);
            const [showPopup, setShowPopup] = React.useState(false); // Стейт для віконця

            React.useEffect(() => {
                signInAnonymously(auth);
                const timer = setInterval(() => setNow(Date.now()), 10000);
                const unsub = onSnapshot(collection(db, 'orders'), s => {
                    setBookings(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => { clearInterval(timer); unsub(); };
            }, []);

            const isV = r => { const n = parseInt(r); return (n >= 90 && n <= 121) || (n >= 340 && n <= 344); };
            
            const getOrderTimers = (o) => {
                if (!o.confirmed) return { label: "ОЧІКУЄ ПІДТВЕРДЖЕННЯ", time: "WAIT...", color: "text-red-500", bg: "bg-red-900/20" };
                const pickupDate = new Date(o.d + "T06:00:00");
                const pickupTime = pickupDate.getTime();
                if (now < pickupTime) {
                    return { label: "ЗАБЕРУ О 06:00", time: formatDiff(pickupTime - now), color: "text-yellow-500", bg: "bg-yellow-900/20" };
                } else {
                    const finishTime = pickupTime + (PKG[o.package].d * 3600000);
                    const diff = finishTime - now;
                    if (diff <= 0) return { label: "ГОТОВО", time: "ОК", color: "text-green-500", bg: "bg-green-900/20" };
                    return { label: "ПРАННЯ / ГОТОВНІСТЬ", time: formatDiff(diff), color: "text-blue-400", bg: "bg-blue-600/20" };
                }
            };

            const formatDiff = (diff) => {
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                return `${h}г ${m}хв`;
            };

            const fD = d => d ? d.split('-').reverse().slice(0,2).join('.') : '??.??';
            const getM = d => new Date(d).toLocaleString('uk-UA', { month: 'long' });

            const checkLimit = (date, pkgType) => {
                const dayB = bookings.filter(b => b.d === date && !b.archived);
                if (dayB.length === 0) return false;
                if (dayB.some(b => b.package === 'large')) return true;
                if (pkgType === 'large' && dayB.length > 0) return true;
                return dayB.length >= 2;
            };

            if (!profile) return React.createElement('div', { className: "min-h-screen bg-black text-white flex flex-col justify-center p-8 font-sans relative" },
                React.createElement('div', { onClick: () => { const p = prompt('Password?'); if(p === 'Tokyo') { const a = {adm:true, n:'Адмін', r:'ADM'}; localStorage.setItem('l_u', JSON.stringify(a)); setProfile(a); } }, className: "absolute top-0 right-0 w-20 h-20 z-50" }),
                React.createElement('h1', { className: "text-2xl font-black text-blue-500 mb-8 text-center uppercase" }, "Авторизація"),
                React.createElement('input', { id: "n", placeholder: "Ваше ім'я", className: "p-4 mb-4 bg-gray-900 rounded-2xl outline-none" }),
                React.createElement('input', { id: "r", type: "number", placeholder: "Камера", className: "p-4 mb-6 bg-gray-900 rounded-2xl outline-none" }),
                React.createElement('button', { 
                    onClick: () => {
                        const n = document.getElementById('n').value.trim(), r = document.getElementById('r').value;
                        if(n && isV(r)) { const u={n, r, adm:false}; localStorage.setItem('l_u', JSON.stringify(u)); setProfile(u); }
                        else alert('Доступ обмежено');
                    }, className: "bg-blue-600 py-4 rounded-2xl font-black uppercase" 
                }, "УВІЙТИ")
            );

            // --- АДМІНКА ---
            if (profile.adm) {
                const filtered = bookings.filter(b => b.d === admD && (view === 'archive' ? b.archived : !b.archived));
                
                // Правильно генеруємо дати для адміна
                const adminCalDays = Array.from({length:30}, (_,i) => {
                    const d = new Date();
                    if (view === 'archive') d.setDate(d.getDate() - i);
                    else d.setDate(d.getDate() + i);
                    return d;
                });

                return React.createElement('div', { className: "p-4 bg-black min-h-screen text-white font-sans" },
                    React.createElement('div', { className: "flex justify-between mb-6 items-center border-b border-white/5 pb-4" }, 
                        React.createElement('div', null,
                            React.createElement('b', {className:"text-yellow-500 text-lg font-black uppercase block"}, view === 'active' ? "Адмін" : "Архів"),
                            React.createElement('button', {onClick:()=>setView(view==='active'?'archive':'active'), className:"text-[9px] text-blue-500 font-black uppercase tracking-widest mt-1"}, view==='active'?'Архів':'Активні')
                        ),
                        React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"text-red-500 text-[10px] font-black uppercase font-bold"}, "Вихід")
                    ),
                    React.createElement('div', { className: "flex gap-2 mb-8 overflow-x-auto pb-4 scrollbar-hide" }, 
                        adminCalDays.map((d, i) => {
                            const ds = getLocD(d);
                            // Визначаємо зміну місяця без багів
                            const prevD = i > 0 ? adminCalDays[i-1] : null;
                            const isFirst = i === 0 || d.getMonth() !== prevD.getMonth();
                            
                            const dayB = bookings.filter(b => b.d === ds && (view === 'archive' ? b.archived : !b.archived));
                            const isFull = view === 'active' && (dayB.length >= 2 || dayB.some(b => b.package === 'large'));
                            const hasArchived = view === 'archive' && dayB.length > 0;

                            return React.createElement(React.Fragment, {key:ds},
                                isFirst && React.createElement('div', {className:"flex items-center px-1 text-[8px] font-black uppercase text-blue-500 rotate-180", style:{writingMode:'vertical-lr'}}, getM(d)),
                                React.createElement('button', {
                                    onClick:()=>setAdmD(ds),
                                    className:`min-w-[42px] aspect-square rounded-xl flex flex-col items-center justify-center border transition-all 
                                    ${admD===ds ? 'bg-yellow-600 border-yellow-400' : isFull ? 'bg-red-600 border-red-500' : hasArchived ? 'bg-blue-900 border-blue-800' : 'bg-gray-900 border-gray-800'}`
                                }, 
                                    React.createElement('span', {className:"text-[7px] font-bold uppercase"}, WD[d.getDay()]),
                                    React.createElement('span', {className:"font-black text-sm"}, d.getDate())
                                )
                            );
                        })
                    ),

                    filtered.map((b) => {
                        const t = getOrderTimers(b);
                        return React.createElement('div', { key: b.id, className: "bg-gray-900/50 p-6 mb-4 rounded-3xl border border-gray-800" },
                            React.createElement('div', { className: "flex justify-between mb-4" },
                                React.createElement('div', null, React.createElement('div', {className:"font-black text-xl leading-none uppercase font-bold"}, `${b.r} — ${b.n}`), React.createElement('div', {className:"text-blue-400 text-[10px] font-black uppercase mt-1 font-bold"}, PKG[b.package]?.n)),
                                React.createElement('div', {className:"flex gap-4"},
                                    React.createElement('button', {onClick:()=>confirm('Видалити?') && deleteDoc(doc(db,'orders',b.id)), className:"text-xl opacity-50"}, "🗑️"),
                                    !b.archived && React.createElement('button', {onClick:()=>confirm('В архів?') && updateDoc(doc(db,'orders',b.id), {archived: true}), className:"text-xl opacity-50"}, "📥")
                                )
                            ),
                            !b.archived && React.createElement('div', {className:"relative mb-4"},
                                React.createElement('textarea', { id: `n-${b.id}`, defaultValue: b.note || "", placeholder: "Коментар...", className: "w-full bg-black border border-white/5 rounded-2xl p-4 text-xs min-h-[80px] outline-none" }),
                                React.createElement('button', { onClick: () => updateDoc(doc(db,'orders',b.id), {note: document.getElementById(`n-${b.id}`).value}), className: "absolute bottom-3 right-3 bg-blue-600 p-2 rounded-lg text-[8px] font-black font-bold" }, "SAVE")
                            ),
                            !b.confirmed && !b.archived ? React.createElement('button', {
                                onClick: () => updateDoc(doc(db,'orders',b.id), {confirmed: true}),
                                className:"w-full bg-blue-600 py-4 rounded-2xl text-[10px] font-black uppercase font-bold"
                            }, "Підтвердити") : React.createElement('div', {className:`${t.color} font-black text-[10px] uppercase font-bold`}, b.archived ? "В АРХІВІ" : `${t.label}: ${t.time}`)
                        );
                    })
                );
            }

            // --- ЮЗЕР ---
            const myOrders = bookings.filter(b => b.r === profile.r && b.n.toLowerCase() === profile.n.toLowerCase());
            const myFiltered = (view === 'active' ? myOrders.filter(o => !o.archived) : myOrders.filter(o => o.archived)).sort((a,b) => b.d.localeCompare(a.d));

            // Правильно генеруємо дати для юзера
            const userCalDays = Array.from({length:14}, (_,i) => {
                const d = new Date(); d.setDate(d.getDate()+i+1); 
                return d;
            });

            return React.createElement('div', { className: "min-h-screen bg-black text-white pb-10 font-sans" },
                React.createElement('header', { className: "p-6 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-md z-50 border-b border-white/5" },
                    React.createElement('div', null,
                        React.createElement('b', {className:"text-blue-500 text-xl font-black uppercase tracking-tighter font-bold font-bold"}, profile.n),
                        React.createElement('div', {className:"flex gap-4 mt-2 font-bold"},
                            React.createElement('button', {onClick:()=>setView('active'), className:`text-[10px] font-black uppercase ${view==='active'?'text-white':'text-gray-600'}`}, "Активні"),
                            React.createElement('button', {onClick:()=>setView('archive'), className:`text-[10px] font-black uppercase ${view==='archive'?'text-white':'text-gray-600'}`}, "Архів")
                        )
                    ),
                    React.createElement('button', {onClick:()=> {localStorage.clear(); location.reload();}, className:"text-[10px] font-black uppercase text-gray-600 font-bold"}, "Вихід")
                ),
                React.createElement('main', { className: "p-4 space-y-6 max-w-2xl mx-auto" },
                    myFiltered.map((o) => {
                        const t = getOrderTimers(o);
                        return React.createElement('div', { key: o.id, className: "bg-gray-900 rounded-[2.5rem] border border-gray-800 overflow-hidden" },
                            React.createElement('div', { className: `p-2 text-[10px] font-black text-center uppercase tracking-widest ${o.archived ? 'bg-gray-800 text-gray-500' : t.bg + ' ' + t.color}` }, 
                                o.archived ? '📁 АРХІВ' : t.label
                            ),
                            React.createElement('div', {className:"p-6 font-bold"},
                                React.createElement('div', {className:"flex justify-between items-start font-bold"},
                                    React.createElement('div', null, React.createElement('p', {className:"font-black text-xl uppercase tracking-tighter font-bold"}, PKG[o.package]?.n), React.createElement('p', {className:"text-xs text-gray-500 mt-2 font-bold uppercase"}, fD(o.d))),
                                    React.createElement('div', {className:"text-right font-bold"}, 
                                        React.createElement('p', {className:"text-[9px] text-gray-500 uppercase font-black mb-1 font-bold"}, "ЧАС:"),
                                        React.createElement('p', {className: `${t.color} font-black text-2xl tracking-tighter font-bold`}, o.archived ? "OK" : t.time)
                                    )
                                ),
                                o.note && React.createElement('div', {className:"mt-4 bg-blue-600/5 p-4 rounded-2xl border border-blue-600/20 text-xs text-blue-300 italic font-bold font-bold font-bold"}, o.note)
                            )
                        );
                    }),
                    view === 'active' && React.createElement('div', { className: "bg-gray-900 p-6 rounded-[3rem] border border-gray-800" },
                        React.createElement('div', { className: "flex gap-2 mb-8 overflow-x-auto pb-4 scrollbar-hide" }, 
                            userCalDays.map((d, i) => {
                                const ds = getLocD(d);
                                const isFull = checkLimit(ds, selP);
                                const prevD = i > 0 ? userCalDays[i-1] : null;
                                const isFirst = i === 0 || d.getMonth() !== prevD.getMonth();
                                return React.createElement(React.Fragment, {key:ds},
                                    isFirst && React.createElement('div', {className:"flex items-center px-1 text-[8px] font-black uppercase text-blue-500 rotate-180", style:{writingMode:'vertical-lr'}}, getM(d)),
                                    React.createElement('button', {
                                        disabled:isFull, onClick:()=>setSelD(ds),
                                        className:`min-w-[52px] aspect-square rounded-2xl flex flex-col items-center justify-center transition-all ${selD===ds?'bg-blue-600':isFull?'bg-red-600 border border-red-500 cursor-not-allowed font-bold':'bg-black/40 border border-white/5 font-bold'}`
                                    }, React.createElement('span', {className:"text-[9px] opacity-40 font-black mb-1 font-bold"}, WD[d.getDay()]), React.createElement('span', {className:"font-black text-lg font-bold"}, d.getDate()))
                                );
                            })
                        ),
                        Object.entries(PKG).map(([k, p]) => React.createElement('button', {
                            key: k, onClick: () => { setSelP(k); setSelD(null); },
                            className: `p-5 rounded-[2.5rem] border-2 w-full text-left mb-3 flex justify-between items-center transition ${selP === k ? 'border-blue-600 bg-blue-600/5' : 'border-transparent bg-black/20 opacity-40'}`
                        }, React.createElement('p', {className:"font-black text-sm uppercase font-bold"}, p.n), React.createElement('p', {className:"text-[10px] font-black text-gray-500 font-bold"}, `~ ${p.d} год.`))),
                        myFiltered.length >= 2 ? React.createElement('p', {className:"text-center text-red-500 text-[10px] font-black uppercase mt-4 font-bold"}, "Ліміт активних замовлень") :
                        React.createElement('button', { 
                            onClick: async () => {
                                if (loading) return; setLoading(true);
                                await addDoc(collection(db,'orders'), {r:profile.r, n:profile.n, d:selD, package:selP, archived:false, confirmed:false, createdAt:serverTimestamp()});
                                setSelD(null); setLoading(false);
                                setShowPopup(true); // Показуємо віконце після запису
                            },
                            disabled: !selD || loading, className: "w-full bg-blue-600 py-5 rounded-[2.5rem] font-black text-lg mt-5 disabled:opacity-20 uppercase font-bold"
                        }, loading ? "ЗАПИС..." : "ЗАПИСАТИСЯ")
                    )
                ),

                // --- ПОПАП (ВІКОНЦЕ) ---
                showPopup && React.createElement('div', { className: "fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-6 backdrop-blur-sm" },
                    React.createElement('div', { className: "bg-gray-900 border border-blue-500/30 p-8 rounded-[2.5rem] text-center max-w-sm w-full shadow-2xl" },
                        React.createElement('div', { className: "text-5xl mb-6" }, "✅"),
                        React.createElement('h2', { className: "text-2xl font-black text-white uppercase tracking-tighter mb-2" }, "Заявку прийнято"),
                        React.createElement('p', { className: "text-sm text-gray-400 mb-8 font-bold" }, "Очікуйте підтвердження в системі."),
                        React.createElement('div', { className: "bg-red-500/10 border border-red-500/20 rounded-3xl p-6 mb-8 text-left" },
                            React.createElement('p', { className: "text-red-400 text-sm font-black uppercase mb-2 flex items-center gap-2" }, "⚠️ Важливо!"),
                            React.createElement('p', { className: "text-xs text-red-200 leading-relaxed font-bold" }, "Перед здачею обов'язково перевірте всі кишені! Витягніть запанички, папірці та сміття. Бажано вивернути речі.")
                        ),
                        React.createElement('button', {
                            onClick: () => setShowPopup(false),
                            className: "w-full bg-blue-600 py-4 rounded-2xl font-black text-sm uppercase tracking-widest text-white shadow-lg shadow-blue-900/50"
                        }, "Зрозуміло")
                    )
                )
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
    <style> body { background: black; -webkit-tap-highlight-color: transparent; } .scrollbar-hide::-webkit-scrollbar { display: none; } </style>
</head>
<body><div id="root"></div></body>
</html>
