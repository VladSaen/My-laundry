<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧺 Laundry System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c",
            measurementId: "G-N33YNQTN3B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const ADMIN_PASSWORD = "Tokyo";
        const PACKAGES = {
            small: { label: 'Малий пакет', desc: 'До 5кг. Повернення ~24 год.' },
            medium: { label: 'Середній пакет', desc: '5-10кг. Повернення ~24-48 год.' },
            large: { label: 'Великий пакет', desc: '10кг+. Повернення ~48-72 год.' }
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('laundry_user')) || null);
            const [bookings, setBookings] = React.useState([]);
            const [selectedDate, setSelectedDate] = React.useState(null);
            const [selectedPackage, setSelectedPackage] = React.useState('small');
            const [isRegistering, setIsRegistering] = React.useState(!profile);
            const [dbError, setDbError] = React.useState(null);

            React.useEffect(() => {
                signInAnonymously(auth).catch(err => setDbError("Помилка входу: " + err.message));
                return onAuthStateChanged(auth, setUser);
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const q = collection(db, 'orders');
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setBookings(data);
                    setDbError(null);
                }, (err) => {
                    setDbError("Помилка бази: " + err.message);
                });
                return () => unsubscribe();
            }, [user]);

            React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const handleSecretAdmin = () => {
                const pass = prompt("Введіть ключ доступу:");
                if (pass === ADMIN_PASSWORD) {
                    const adminUser = { room: 'ADMIN', name: 'Адміністратор', isAdmin: true };
                    localStorage.setItem('laundry_user', JSON.stringify(adminUser));
                    setProfile(adminUser);
                    setIsRegistering(false);
                } else if (pass !== null) {
                    alert("Невірний ключ");
                }
            };

            const getCalendarMonths = () => {
                const months = {};
                const weekDays = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
                for(let i = 1; i <= 21; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    const monthName = d.toLocaleString('uk-UA', { month: 'long' });
                    const dateStr = d.toISOString().split('T')[0];
                    if (!months[monthName]) months[monthName] = [];
                    months[monthName].push({ date: dateStr, day: d.getDate(), weekday: weekDays[d.getDay()] });
                }
                return months;
            };

            const createOrder = async () => {
                if (!selectedDate) return;
                if (bookings.some(b => b.date === selectedDate)) {
                    alert("⚠️ Ця дата вже кимось зайнята!");
                    return;
                }
                try {
                    await addDoc(collection(db, 'orders'), {
                        room: profile.room,
                        clientName: profile.name,
                        date: selectedDate,
                        package: selectedPackage,
                        status: 'Прийнято',
                        createdAt: serverTimestamp(),
                        returnDateInfo: 'Очікуйте 24-48 год'
                    });
                    alert('✅ Запис успішний! Дані оновлено.');
                    setSelectedDate(null);
                } catch (e) {
                    alert("❌ Помилка збереження: " + e.message);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('laundry_user');
                location.reload();
            };

            if (isRegistering) {
                return React.createElement('div', { className: "min-h-screen bg-black text-white flex items-center justify-center p-6 font-sans relative" },
                    // НЕВИДИМА КНОПКА АДМІНА
                    React.createElement('div', { 
                        onClick: handleSecretAdmin,
                        className: "absolute top-0 right-0 w-16 h-16 cursor-default z-50"
                    }),
                    
                    React.createElement('form', { 
                        onSubmit: (e) => {
                            e.preventDefault();
                            const name = e.target.name.value;
                            const room = e.target.room.value;
                            const newUser = { room: room, name, isAdmin: false };
                            localStorage.setItem('laundry_user', JSON.stringify(newUser));
                            setProfile(newUser);
                            setIsRegistering(false);
                        },
                        className: "bg-gray-900 p-8 rounded-[2rem] w-full max-w-sm border border-gray-800 shadow-2xl"
                    },
                        React.createElement('h1', { className: "text-3xl font-black mb-2 text-blue-500" }, "Laundry"),
                        React.createElement('p', { className: "text-gray-500 mb-8 text-sm" }, "Заповніть дані для запису"),
                        React.createElement('input', { name: "room", required: true, placeholder: "Номер хати", className: "w-full p-4 mb-4 bg-gray-800 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition" }),
                        React.createElement('input', { name: "name", required: true, placeholder: "Ваше ім'я", className: "w-full p-4 mb-8 bg-gray-800 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition" }),
                        React.createElement('button', { className: "w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold text-lg transition-all active:scale-95 shadow-[0_0_20px_rgba(37,99,235,0.3)]" }, "Увійти")
                    )
                );
            }

            if (profile?.isAdmin) {
                return React.createElement('div', { className: "min-h-screen bg-black text-white p-4 font-sans" },
                    React.createElement('div', { className: "flex justify-between items-center mb-8 bg-gray-900 p-4 rounded-2xl" },
                        React.createElement('h1', { className: "text-xl font-bold text-yellow-500" }, "Адмін-панель"),
                        React.createElement('button', { onClick: handleLogout, className: "p-2 bg-red-900/20 text-red-500 rounded-xl text-xs font-bold" }, "ВИЙТИ")
                    ),
                    dbError && React.createElement('div', { className: "bg-red-600 p-4 rounded-xl mb-4 text-sm" }, dbError),
                    bookings.length === 0 ? React.createElement('p', { className: "text-center text-gray-500 mt-20" }, "Замовлень поки немає") :
                    bookings.sort((a,b) => a.date.localeCompare(b.date)).map(order => React.createElement('div', { key: order.id, className: "bg-gray-900 p-5 mb-3 rounded-3xl border border-gray-800" },
                        React.createElement('div', { className: "flex justify-between items-start" },
                            React.createElement('div', null,
                                React.createElement('div', { className: "font-bold text-lg text-white" }, `🏠 Хата ${order.room}`),
                                React.createElement('div', { className: "text-gray-400 text-sm" }, order.clientName),
                                React.createElement('div', { className: "mt-2 text-blue-400 font-medium" }, `${order.date} • ${PACKAGES[order.package]?.label}`)
                            ),
                            React.createElement('button', { onClick: () => { if(confirm('Видалити цей запис?')) deleteDoc(doc(db, 'orders', order.id)) }, className: "p-3 bg-red-900/30 text-red-500 rounded-2xl" }, React.createElement('i', { 'data-lucide': "trash-2", className: "w-5 h-5" }))
                        )
                    ))
                );
            }

            const myOrders = bookings.filter(b => b.room === profile.room && b.clientName === profile.name);
            const calendar = getCalendarMonths();

            return React.createElement('div', { className: "min-h-screen bg-black text-white font-sans pb-20" },
                dbError && React.createElement('div', { className: "bg-red-600 p-2 text-center text-[10px] sticky top-0 z-50" }, dbError),
                
                React.createElement('header', { className: "p-6 flex justify-between items-center bg-gray-900/50 backdrop-blur-md sticky top-0 z-40" },
                    React.createElement('div', null,
                        React.createElement('h1', { className: "text-xl font-black text-blue-500" }, profile.name),
                        React.createElement('p', { className: "text-gray-500 text-xs" }, `Хата ${profile.room}`)
                    ),
                    React.createElement('button', { onClick: handleLogout, className: "p-3 bg-gray-800 rounded-2xl text-gray-400" }, React.createElement('i', { 'data-lucide': "log-out", className: "w-5 h-5" }))
                ),

                React.createElement('main', { className: "max-w-md mx-auto px-4 space-y-8 mt-6" },
                    myOrders.length > 0 && React.createElement('section', null,
                        React.createElement('h2', { className: "text-[10px] font-bold uppercase text-gray-600 mb-4 tracking-[0.2em] pl-2" }, "Ваші активні записи"),
                        myOrders.map(order => React.createElement('div', { key: order.id, className: "bg-gray-900 p-5 rounded-[2rem] border-l-4 border-blue-600 mb-3 shadow-xl" },
                            React.createElement('div', { className: "flex justify-between items-center mb-1" },
                                React.createElement('span', { className: "font-bold text-sm" }, PACKAGES[order.package]?.label),
                                React.createElement('span', { className: "text-[9px] font-black bg-blue-600 px-3 py-1 rounded-full uppercase" }, order.status)
                            ),
                            React.createElement('div', { className: "text-xs text-gray-400" }, order.date),
                            React.createElement('div', { className: "text-[10px] text-blue-400 mt-2 italic" }, `🚚 ${order.returnDateInfo}`)
                        ))
                    ),

                    React.createElement('section', { className: "bg-gray-900 p-6 rounded-[2.5rem] border border-gray-800 shadow-2xl" },
                        React.createElement('h2', { className: "text-lg font-bold mb-6 text-center" }, "Забронювати стірку"),
                        
                        React.createElement('div', { className: "grid grid-cols-1 gap-3 mb-8" },
                            Object.entries(PACKAGES).map(([key, pkg]) => React.createElement('button', {
                                key: key,
                                onClick: () => setSelectedPackage(key),
                                className: `p-4 rounded-3xl border-2 text-left transition-all ${selectedPackage === key ? 'border-blue-600 bg-blue-600/10' : 'border-gray-800 bg-black/20'}`
                            }, 
                                React.createElement('div', { className: "font-bold text-sm" }, pkg.label),
                                React.createElement('div', { className: "text-[10px] text-gray-500" }, pkg.desc)
                            ))
                        ),

                        Object.entries(calendar).map(([month, days]) => React.createElement('div', { key: month, className: "mb-8" },
                            React.createElement('h3', { className: "text-[10px] font-black text-gray-600 mb-4 uppercase text-center tracking-widest" }, month),
                            React.createElement('div', { className: "grid grid-cols-4 gap-3" },
                                days.map(d => {
                                    const isBooked = bookings.some(b => b.date === d.date);
                                    const isSelected = selectedDate === d.date;
                                    return React.createElement('button', {
                                        key: d.date,
                                        disabled: isBooked,
                                        onClick: () => setSelectedDate(d.date),
                                        className: `aspect-square rounded-2xl flex flex-col items-center justify-center transition-all ${
                                            isSelected ? 'bg-blue-600 shadow-[0_0_20px_rgba(37,99,235,0.4)] scale-110 z-10' : 
                                            isBooked ? 'bg-red-900/20 text-red-700 border border-red-900/30' : 'bg-gray-800 hover:bg-gray-700 active:scale-95'
                                        }`
                                    }, 
                                        React.createElement('span', {className: "text-lg font-black"}, d.day),
                                        React.createElement('span', {className: "text-[9px] font-bold uppercase opacity-40"}, d.weekday)
                                    )
                                })
                            )
                        )),

                        React.createElement('button', { 
                            onClick: createOrder, 
                            disabled: !selectedDate, 
                            className: "w-full bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 disabled:text-gray-600 py-5 rounded-3xl font-black text-lg shadow-xl transition-all active:scale-95" 
                        }, "ПІДТВЕРДИТИ")
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
    <style>
        body { background-color: black; color: white; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        * { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        input::placeholder { color: #4b5563; }
    </style>
</head>
<body><div id="root"></div></body>
</html>
