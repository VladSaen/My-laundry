<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laundry</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaH3AqFO4cKsq4TjXbAFcxghKx9LqaBHw",
            authDomain: "my-laundry-84f8b.firebaseapp.com",
            projectId: "my-laundry-84f8b",
            storageBucket: "my-laundry-84f8b.firebasestorage.app",
            messagingSenderId: "524025568005",
            appId: "1:524025568005:web:65f72b000e8db75938f56c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const e = React.createElement;

        const getFullDev = () => {
            const ua = navigator.userAgent;
            const res = `${window.screen.width}x${window.screen.height}`;
            let gpu = "Unknown";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL).split(' ').pop();
            } catch(err) {}
            
            if (/iPhone/i.test(ua)) return `iPhone | ${res} | ${gpu}`;
            if (/Android/i.test(ua)) return `Android | ${res} | ${gpu}`;
            return `PC | ${res}`;
        };

        function App() {
            const [profile, setProfile] = React.useState(() => JSON.parse(localStorage.getItem('l_u')));
            const [bookings, setBookings] = React.useState([]);
            const [view, setView] = React.useState('active'); 
            const [selD, setSelD] = React.useState(new Date().toISOString().split('T')[0]);
            const [curM, setCurM] = React.useState(new Date());

            React.useEffect(() => {
                signInAnonymously(auth);
                return onSnapshot(collection(db, 'orders'), s => setBookings(s.docs.map(d => ({ id: d.id, ...d.data() }))));
            }, []);

            const renderCalendar = (onDayClick, selectedDay) => {
                const y = curM.getFullYear(), m = curM.getMonth();
                const first = new Date(y, m, 1).getDay();
                const offset = first === 0 ? 6 : first - 1;
                const days = new Date(y, m + 1, 0).getDate();
                const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];

                const daysElements = [];
                // Заголовки днів тижня
                WD.forEach(d => daysElements.push(e('div', { key: d, className: "text-[8px] text-gray-700 text-center font-black uppercase" }, d)));
                // Пусті клітинки
                for (let i = 0; i < offset; i++) daysElements.push(e('div', { key: 'o'+i }));
                // Дні місяця
                for (let d = 1; d <= days; d++) {
                    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const act = bookings.filter(b => b.d === ds && !b.archived);
                    const isFull = act.length >= 2;
                    daysElements.push(e('div', {
                        key: d,
                        onClick: () => onDayClick(ds),
                        className: `aspect-square flex items-center justify-center rounded-2xl text-xs font-black border transition-all cursor-pointer ${selectedDay === ds ? 'bg-blue-600 border-blue-400 scale-110' : isFull ? 'bg-red-900/10 border-red-900/20 text-red-500' : 'bg-black/40 border-white/5'}`
                    }, d));
                }

                return e('div', { className: "bg-gray-900 rounded-[2.5rem] p-6 border border-white/5 mb-6" },
                    e('div', { className: "flex justify-between items-center mb-6 px-2" },
                        e('button', { onClick: () => setCurM(new Date(y, m - 1)), className: "text-lg" }, "←"),
                        e('b', { className: "uppercase text-[10px] tracking-widest text-blue-400" }, curM.toLocaleString('uk-UA', { month: 'long', year: 'numeric' })),
                        e('button', { onClick: () => setCurM(new Date(y, m + 1)), className: "text-lg" }, "→")
                    ),
                    e('div', { className: "grid grid-cols-7 gap-2" }, daysElements)
                );
            };

            // Екран входу
            if (!profile) return e('div', { className: "p-8 bg-black min-h-screen text-white flex flex-col justify-center font-sans" },
                e('h1', { className: "text-2xl font-black mb-8 text-center uppercase" }, "Вхід"),
                e('input', { id: "n", placeholder: "Ім'я", className: "p-5 mb-4 bg-gray-900 rounded-[2rem] outline-none" }),
                e('input', { id: "r", type: "number", placeholder: "Кімната", className: "p-5 mb-8 bg-gray-900 rounded-[2rem] outline-none" }),
                e('button', { 
                    onClick: () => {
                        const n = document.getElementById('n').value.trim(), r = document.getElementById('r').value.trim();
                        if(n && r) {
                            const u = {n, r, adm: n.toLowerCase()==='admin' && r==='777'};
                            localStorage.setItem('l_u', JSON.stringify(u));
                            setProfile(u);
                        }
                    }, className: "bg-blue-600 py-5 rounded-[2rem] font-black uppercase"
                }, "Увійти")
            );

            // АДМІНКА
            if (profile.adm) {
                const stats = {};
                bookings.forEach(b => {
                    const k = `${b.n.toLowerCase()}_${b.r}`;
                    if(!stats[k]) stats[k] = { n: b.n, r: b.r, dev: b.dev || '?', o: [] };
                    stats[k].o.push(b);
                });

                return e('div', { className: "p-4 bg-black min-h-screen text-white pb-24" },
                    e('div', { className: "flex justify-between mb-8 border-b border-white/10 pb-4 text-[10px] font-black uppercase" },
                        e('div', { className: "flex gap-4" },
                            e('button', { onClick: () => setView('active'), className: view==='active'?'text-blue-500':'text-gray-500' }, "Календар"),
                            e('button', { onClick: () => setView('archive'), className: view==='archive'?'text-blue-500':'text-gray-500' }, "Архів"),
                            e('button', { onClick: () => setView('stats'), className: view==='stats'?'text-blue-500':'text-gray-500' }, "Статистика")
                        ),
                        e('button', { onClick: () => {localStorage.clear(); location.reload();}, className: "text-red-500" }, "Вихід")
                    ),
                    view !== 'stats' ? e(React.Fragment, null,
                        renderCalendar(setSelD, selD),
                        e('div', { className: "space-y-3" },
                            bookings.filter(b => b.d === selD && (view === 'archive' ? b.archived : !b.archived)).map(b => 
                                e('div', { key: b.id, className: "bg-gray-900 p-5 rounded-[2.5rem] flex justify-between items-center border border-white/5" },
                                    e('div', null, 
                                        e('div', { className: "font-black uppercase text-lg" }, `${b.n} (к.${b.r})`),
                                        e('div', { className: "text-[9px] text-gray-500 font-bold uppercase" }, `📱 ${b.dev || '?'}`)
                                    ),
                                    e('div', { className: "flex gap-4" },
                                        !b.archived && e('button', { onClick: () => updateDoc(doc(db,'orders',b.id),{archived:true}) }, "✅"),
                                        e('button', { onClick: () => confirm('Видалити?') && deleteDoc(doc(db,'orders',b.id)) }, "🗑️")
                                    )
                                )
                            )
                        )
                    ) : e('div', { className: "space-y-4" },
                        Object.values(stats).sort((a,b)=>b.o.length-a.o.length).map(u => 
                            e('div', { key: u.n+u.r, className: "bg-gray-900 p-6 rounded-[2.5rem]" },
                                e('div', { className: "flex justify-between" },
                                    e('div', null, 
                                        e('b', { className: "uppercase text-xl block" }, u.n),
                                        e('span', { className: "text-blue-500 text-[10px] font-black uppercase" }, `Кімната ${u.r}`),
                                        e('p', { className: "text-[9px] text-gray-600 mt-4 font-bold" }, "ПРИСТРІЙ:"),
                                        e('p', { className: "text-[10px] text-gray-300 font-black" }, u.dev)
                                    ),
                                    e('div', { className: "bg-blue-600 text-white px-4 py-2 rounded-2xl text-xs font-black" }, `${u.o.length} прань`)
                                )
                            )
                        )
                    )
                );
            }

            // ЮЗЕР
            return e('div', { className: "p-8 bg-black min-h-screen text-white flex flex-col font-sans" },
                e('div', { className: "flex justify-between items-center mb-8" },
                    e('div', { className: "text-2xl font-black uppercase tracking-tighter" }, `Привіт, ${profile.n}`),
                    e('button', { onClick: () => {localStorage.clear(); location.reload();}, className: "text-[10px] text-gray-600 font-black uppercase border border-white/5 px-3 py-1 rounded-full" }, "Вихід")
                ),
                e('p', { className: "text-[10px] font-black text-gray-500 uppercase mb-4 tracking-widest" }, "Вибери день у календарі:"),
                renderCalendar(setSelD, selD),
                e('div', { className: "mt-auto pt-6" },
                    e('button', { 
                        onClick: async () => {
                            const isFull = bookings.filter(b => b.d === selD && !b.archived).length >= 2;
                            if(isFull) return alert("Цей день вже зайнятий!");
                            await addDoc(collection(db,'orders'), {
                                r: profile.r, n: profile.n, d: selD, archived: false,
                                dev: getFullDev(), createdAt: serverTimestamp()
                            });
                            alert("Записано!");
                        }, className: "w-full bg-blue-600 py-6 rounded-[2.5rem] font-black uppercase text-lg shadow-xl shadow-blue-900/20"
                    }, `Записатись на ${selD.split('-').reverse().slice(0,2).join('.')}`)
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
    <style>
        body { background: black; margin: 0; font-family: system-ui; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body><div id="root"></div></body>
</html>
